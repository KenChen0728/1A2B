<script>
const app=document.getElementById('app');
const APP_VERSION='2026.11.02-14';
const MAXP=8, CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let baseMe=null, solo=null, why='', db=null, me=null, code=null, R=null, roomMissing=false, guesses=[], secrets=[], chat=[], unsubs=[];
let mySecret=null, input='', err='', homeErr='', peek=false, view=null, nick='', busy=false, scored=new Set(), noAccess='';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

function score(secret,guess){
  let A=0;const cs={},cg={};
  for(let i=0;i<secret.length;i++){if(secret[i]===guess[i])A++;cs[secret[i]]=(cs[secret[i]]||0)+1;cg[guess[i]]=(cg[guess[i]]||0)+1;}
  let c=0;for(const d in cg)c+=Math.min(cg[d],cs[d]||0);return{A,B:c-A};
}
function hk(pid){let h=0;for(const ch of String(pid))h=(h*31+ch.charCodeAt(0))%9973;return h;}
function enc(s,r,pid){const k=r*7+hk(pid)*3;return btoa(s.split('').map((d,i)=>String.fromCharCode(65+((+d+k+i*5)%10)+10*((i*7+r)%2))).join('')).split('').reverse().join('');}
function dec(c,r,pid){const k=r*7+hk(pid)*3;try{return atob(c.split('').reverse().join('')).split('').map((ch,i)=>{const v=(ch.charCodeAt(0)-65)%10;return String(((v-(k+i*5))%10+1000000)%10);}).join('');}catch(e){return null;}}

const g=()=>solo||R||{};
function assignMap(){try{return JSON.parse(g().assign||'{}')||{};}catch(e){return{};}}
function players(){const S=g().seats||{};return Object.entries(S).filter(([id,v])=>v&&typeof v==='object').map(([id,v])=>({id,...v})).sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0));}
const isSeated=id=>!!(id&&g().seats&&g().seats[id]);
const nameOf=id=>(g().seats&&g().seats[id]&&g().seats[id].name)||(g().watchers&&g().watchers[id]&&g().watchers[id].name)||'玩家';
const isWatcher=id=>!!(id&&!isSeated(id)&&g().watchers&&g().watchers[id]);
const watchersList=()=>Object.entries(g().watchers||{}).filter(([id,v])=>v&&typeof v==='object').map(([id,v])=>({id,...v}));
const isHost=()=>g().host===me;
function secretOf(pid){const s=g();const d=secrets.find(x=>x.round===s.round&&x.pid===pid);return d?dec(d.c,d.round,d.pid):null;}
const hasSecret=pid=>secrets.some(x=>x.round===g().round&&x.pid===pid);

function derive(){
  const s=g(), P=players(), A=assignMap(), parts=Object.keys(A), seats=s.seats||{};
  const rg=guesses.filter(x=>x.round===s.round);
  const hc=s.hintCost==null?2:s.hintCost, aN=angelMax(), ac=s.angelCost==null?1:s.angelCost, angels={}, turn={}, cnt={}, by={}, solved={}, solvedAt={}, pend={}, best={}, hints={}, out={};
  parts.forEach(id=>{
    const L=rg.filter(x=>x.pid===id).sort((a,b)=>a.n-b.n); by[id]=L;
    const i=L.findIndex(x=>!x.hint&&x.A===s.len); turn[id]=i<0?0:i+1; solvedAt[id]=i<0?0:L[i].at||0;
    const wt=x=>x.hint?hc:1, an=(seats[id]||{}).an; angels[id]=an&&an.r===s.round?an.n||0:0;
    cnt[id]=L.reduce((t,x)=>t+wt(x),0)+angels[id]*ac; solved[id]=i<0?0:L.slice(0,i+1).reduce((t,x)=>t+wt(x),0)+angels[id]*ac;
    pend[id]=L.find(x=>!x.hint&&x.A==null)||null;
    best[id]=L.filter(x=>!x.hint&&x.A!=null).reduce((b,x)=>(!b||x.A*10+x.B>b.A*10+b.B)?x:b,null);
    hints[id]=L.filter(x=>x.hint).length;
    out[id]=!seats[id]?'left':(seats[id].gaveUp===s.round?'gave':'');
  });
  const live=parts.filter(id=>!out[id]&&!turn[id]);
  const S=parts.filter(id=>turn[id]).reduce((m,id)=>Math.min(m,turn[id]),Infinity);
  const minN=live.length?Math.min(...live.map(id=>by[id].length)):0;
  const allIn=parts.length>0&&parts.every(hasSecret);
  let status;
  if(s.phase!=='secret'&&s.phase!=='playing') status='lobby';
  else if(!allIn) status='secret';
  else if(!parts.every(id=>(seats[id]||{}).ack===s.round||out[id])||!s.startAt) status='loading';
  else if(Date.now()<s.startAt&&s.startAt-Date.now()<8000) status='countdown';
  else if(live.length===0||(!s.finish&&S<Infinity&&live.every(id=>by[id].length>=S))) status='over';
  else status='playing';
  let rank=[];
  if(parts.length){
    rank=parts.map(id=>({id,c:solved[id],n:cnt[id],h:hints[id],a:angels[id],out:out[id],best:best[id]}));
    const bv=r=>r.best?r.best.A*10+r.best.B:-1;
    rank.sort((a,b)=>{if(!!b.c!==!!a.c)return b.c?1:-1; if(a.c&&b.c)return a.c-b.c; if(!!a.out!==!!b.out)return a.out?1:-1; return bv(b)-bv(a);});
    let place=0,prev=null;rank.forEach((r,i)=>{if(!r.c){r.place=null;return;}if(r.c!==prev){place=i+1;prev=r.c;}r.place=place;});
  }
  const can=id=>status==='playing'&&id in A&&!out[id]&&!solved[id]&&!pend[id]&&(s.finish||(by[id].length<=minN&&by[id].length<S));
  const waiting=id=>status==='playing'&&id in A&&!out[id]&&!solved[id]&&!pend[id]&&!can(id);
  const acked=parts.filter(id=>(seats[id]||{}).ack===s.round);
  return{hc,aN,ac,angels,cnt,turn,P,A,parts,by,solved,pend,best,hints,out,status,rank,can,waiting,allIn,acked,minN,S};
}

function validate(v){const s=g();if(v.length!==s.len)return`請輸入 ${s.len} 位數字`;if(!s.rep&&new Set(v).size!==v.length)return'數字不能重複';return'';}
function slots(masked){let h='<div class="slots">';for(let i=0;i<g().len;i++){const d=input[i];h+=`<div class="slot ${d===undefined?'empty':''}">${d===undefined?'':(masked&&!peek?'●':d)}</div>`;}return h+'</div>';}
function pad(useNotes){
  const ks=['1','2','3','4','5','6','7','8','9','del','0','ok'];
  return'<div class="pad">'+ks.map(k=>{
    if(k==='del')return`<button data-k="del" aria-label="刪除">⌫</button>`;
    if(k==='ok')return`<button class="ok" data-k="ok" ${busy?'disabled':''}>確定</button>`;
    const nt=useNotes?(notes.d[+k]===2?'no':notes.d[+k]===1?'yes':''):'';
    return`<button data-k="${k}" class="${!g().rep&&input.includes(k)?'used':''} ${nt}">${k}</button>`;
  }).join('')+'</div>';
}
const ab=x=>x?`<span class="A">${x.A}A</span><span class="B">${x.B}B</span>`:'—';
function histHTML(list){
  if(!list||!list.length)return'<div class="empty-h">還沒猜過</div>';
  return'<div class="hist">'+list.map((r,i)=>r.hint?`<div class="hrow hintrow"><span class="hn">${i+1}</span><span class="hg">第 ${(+r.pos)+1} 位是 ${esc(r.g)}</span><span class="score"><span class="pill">提示</span></span></div>`:`<div class="hrow"><span class="hn">${i+1}</span><span class="hg">${esc(r.g)}</span><span class="score">${r.A==null?'<span class="W"><span class="dot"></span>計算中</span>':ab(r)}</span></div>`).join('')+'</div>';
}
function board(D,def){
  const v=(view&&view in D.A)?view:def;
  return`<div class="card"><span class="lbl">猜題紀錄</span><div class="tabs">${D.parts.map(id=>`<button data-view="${esc(id)}" aria-pressed="${v===id}">${esc(nameOf(id))}${id===me?'（你）':''}</button>`).join('')}</div>
  <p class="sub">${esc(nameOf(v))} 猜 ${esc(nameOf(D.A[v]))} 的題目</p>${histHTML(D.by[v])}</div>`;
}
function progress(D){
  return`<div class="card"><span class="lbl">大家的進度${watchersList().length?`　·　${watchersList().length} 位觀眾在看`:''}</span>
  <div class="ptable"><div class="ph"><span>玩家</span><span>猜誰</span><span>次數</span><span>最高</span></div>
  ${D.parts.map(id=>`<div class="pr ${id===me?'me':''}"><span class="pn">${esc(nameOf(id))}</span><span class="pt">${esc(nameOf(D.A[id]))}</span><span class="pnum">${D.cnt[id]}${D.hints[id]?`<small class="hc">提示${D.hints[id]}</small>`:''}${D.angels[id]?`<small class="hc">天使${D.angels[id]}</small>`:''}</span><span class="score">${D.solved[id]?'<span class="pill ok">猜中</span>':D.out[id]==='gave'?'<span class="pill">放棄</span>':D.out[id]==='left'?'<span class="pill">離開</span>':ab(D.best[id])}</span></div>`).join('')}</div></div>`;
}
function seg(attr,opts,cur,dis){return`<div class="seg">${opts.map(([v,l])=>`<button ${attr}="${v}" aria-pressed="${String(cur)===String(v)}" ${dis?'disabled':''}>${l}</button>`).join('')}</div>`;}

let lastHTML='', pendingPaint=null, homeStep='menu', homeEdit=false, homePre=false;
/* 電腦版：有角色場景的畫面分兩欄，左邊場景固定不捲走、右邊打字 */
const WIDE=900; let wasWide=innerWidth>=WIDE;
function twoCol(){if(innerWidth<WIDE||!app.querySelector(':scope>.card svg.stage'))return;
  const L=document.createElement('div'),R=document.createElement('div');L.className='colL';R.className='colR';
  [...app.children].forEach(c=>{if(c.tagName==='HEADER')return;(c.matches('.vil,.target,.lcol')||c.querySelector('svg.stage')?L:R).appendChild(c);});
  app.append(L,R);}
window.addEventListener('resize',()=>{const w=innerWidth>=WIDE;if(w!==wasWide){wasWide=w;lastHTML='';render();}});
function paint(html){
  const ae=document.activeElement;
  // 下拉選單或輸入框正在使用中：先不要重畫，等使用者選完再更新
  if(ae&&app.contains(ae)&&ae.tagName==='SELECT'){pendingPaint=html;return;}
  pendingPaint=null;
  if(html===lastHTML) return;
  const keep=[];app.querySelectorAll('g.char[data-who]').forEach(c=>{const hs=[...c.querySelectorAll('g.hit:not(.shed)')];const st=KST[c.dataset.who];if(hs.length||(st&&st.down))keep.push([c.dataset.who,hs]);});
  lastHTML=html; lastHTML='';app.innerHTML=html; twoCol(); bind();
  if(!app.querySelector('svg.podium'))for(const k in POS)delete POS[k];
  for(const k in POS){const c=charOf(k);if(c)c.style.translate=POS[k]+'px 0';}
  keep.forEach(([w,hs])=>{const c=charOf(w);if(!c)return;const hd=c.querySelector('.hd');if(hd)hs.forEach(n=>hd.parentNode.appendChild(n));const st=KST[w];if(st&&st.down){c.style.setProperty('--d',st.d);c.classList.add('down');}});
}
app.addEventListener('focusout',()=>setTimeout(()=>{if(pendingPaint!==null&&!(document.activeElement&&app.contains(document.activeElement)&&document.activeElement.tagName==='SELECT')){const x=pendingPaint;pendingPaint=null;lastHTML='';paint(x);}},0));
function render(){
  if(solo) return renderSolo();
  if(!db){lastHTML='';app.innerHTML=`<header><div class="titlerow"><h1>猜數字：幾A幾B</h1><button class="helpbtn" type="button" data-help>？ 說明</button></div><p class="sub">目前連不上多人伺服器，可以先玩邊緣人模式</p></header>${soloCard()}<p class="rules" style="text-align:center">錯誤代碼：${esc(why||'-')} <button class="peek" onclick="location.reload()">重新整理</button></p>`;bind();sideUI(false,false);return;}
  let h='';
  if(noAccess) h+=`<div class="card"><p class="err" style="text-align:left">${esc(noAccess)}</p></div>`;

  /* ---------- 首頁 ---------- */
  if(!code){
    const pre=(location.hash||'').replace('#','').toUpperCase();
    h=`<header><div class="titlerow"><h1>猜數字：幾A幾B</h1><button class="helpbtn" type="button" data-help>？ 說明</button></div><p class="sub">你還要猜多久😴</p></header>`+h+
    (()=>{
      if(!homePre&&/^[A-Z0-9]{4}$/.test(pre)){homePre=true;homeStep='join';}
      const back=`<button class="peek" id="homeBack">← 返回</button>`, err=homeErr?`<p class="err">${esc(homeErr)}</p>`:'';
      if(!nick.trim()||homeEdit) return `<div class="card namecard"><label for="nick"><h2>你叫什麼名字？</h2></label><input type="text" id="nick" maxlength="8" value="${esc(nick)}" placeholder="輸入暱稱，最多 8 個字" autocomplete="off"><button class="btn" id="nickOk">確定</button><p class="err" id="nickErr"></p></div>`;
      if(homeStep==='join') return `<div class="card"><h2>加入房間</h2><div class="sendrow"><input type="text" id="codeIn" maxlength="4" value="${esc(/^[A-Z0-9]{4}$/.test(pre)?pre:'')}" placeholder="輸入 4 碼邀請碼" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-num)"><button class="btn" id="joinBtn" ${busy?'disabled':''}>加入</button></div>
        <div class="watchrow"><span class="sub">只想看、不想玩？用同一個邀請碼</span><button class="btn ghost small" id="watchBtn" ${busy?'disabled':''}>進去觀戰</button></div></div>${err}${back}`;
      if(homeStep==='solo') return soloCard()+back;
      return `<div class="card">${stageSVG([{id:'home',name:nick,look:myLook(),self:true,noyou:true}])}<div class="row homeact"><button class="btn" id="nameBtn">換名字</button><button class="btn" id="lookBtn">換造型</button></div></div>
      ${ls.get('ab_room')?`<div class="card back"><div style="flex:1 1 auto;min-width:0"><span class="lbl">你剛剛在房間</span><b class="secret" style="display:block">${esc(ls.get('ab_room'))}</b></div><button class="btn" id="backRoom" style="width:auto;padding:12px 18px">回到房間</button></div>`:''}
      <div class="homemenu"><button class="btn" id="create" ${busy?'disabled':''}>開新房間</button><button class="btn" id="goJoin">加入房間</button><button class="btn" id="goSolo">邊緣人模式</button></div>${err}${fbCard()}`;

  }
  if(roomMissing){ls.del('ab_room');lastHTML='';app.innerHTML=`<div class="card center" style="padding-block:32px"><h2>房間 ${esc(code)} 已關閉</h2><p class="hand">房主已經關閉這個房間，聊天和遊戲紀錄都清除了。</p><button class="btn" id="home">回首頁</button></div>`;bind();sideUI(false,false);return;}
  if(R&&R.ver!==APP_VERSION){ls.del('ab_room');setTimeout(()=>{goHome();toast('遊戲已更新，請重新開房');},0);lastHTML='';app.innerHTML='';sideUI(false,false);return;}
  if(!R){lastHTML='';app.innerHTML=`<div class="card center" style="padding-block:32px"><h2>房間 ${esc(code)}</h2><p class="sub">讀取中…</p></div>`;sideUI(false,false);return;}
  if(!isSeated(me)&&isWatcher(me)) return renderWatch();
  if(!isSeated(me)){lastHTML='';app.innerHTML=`<div class="card center" style="padding-block:32px"><h2>你已不在房間 ${esc(code)}</h2><button class="btn" id="rejoin">重新加入</button><button class="peek" id="home">回首頁</button></div>`;bind();sideUI(false,false);return;}

  const s=g(), D=derive(), inGame=me in D.A, hostName=nameOf(s.host);
  const nk=code+'_'+s.round; if(s.phase!=='coop'&&inGame&&D.status!=='lobby'&&(notesKey!==nk||notesLen!==s.len)) loadNotes(nk,s.len);
  if(inGame&&(D.status==='playing'||D.status==='over')) autoMarkFrom(D.by[me]||[],s.len);
  h=`<header class="roomhead"><div style="min-width:0"><div class="titlerow"><h1>幾A幾B</h1><button class="helpbtn" type="button" data-help>？</button></div><p class="sub">第 ${s.round} 局 · ${s.len} 位數 · ${s.rep?'可重複':'不重複'} · ${s.mode==='coop'?'合作打魔王 · '+({easy:'簡單',normal:'普通',hard:'困難'}[s.diff||'normal']):s.finish?'全部猜完':'先中先贏'}</p></div>
    <div class="codebox"><span class="lbl">邀請碼</span><b>${esc(code)}</b><button class="peek" id="copyCode">分享</button></div></header>`+h;

  if(s.phase==='coop'){ coopAuto(); h+=coopView(s); }
  else if(D.status==='lobby'){

    ${D.P.length<2?'<p class="rules">把邀請碼傳給朋友，在這個頁面輸入就能加入。</p>':''}${watchersList().length?`<p class="rules">觀眾（${watchersList().length}）：${watchersList().map(w=>esc(w.name)).join('、')}　他們看得到大家的答案，每局有 5 隻幽靈可以嚇人</p>`:''}</div>`;
    const coopM=s.mode==='coop';
    h+=`<div class="card"><span class="lbl">遊戲設定${isHost()?'':'（由房主設定）'}</span>
      <span class="opt">遊戲模式</span>
      ${seg('data-gmode',[['battle','互相猜（對戰）'],['coop','合作打魔王']],s.mode||'battle',!isHost())}
      ${coopM?`<p class="rules" style="margin-top:-6px">全隊對抗一個魔王：大家輪流猜魔王的題，其他人可以語音或在聊天室出主意，筆記全隊共用；魔王每回合也猜一次全隊的題。先猜中的一方獲勝。</p>

function fabApply(){const H=innerHeight,min=70-.38*H,max=H-300-.38*H;FAB.dy=Math.max(min,Math.min(max,FAB.dy||0));

  el.addEventListener('pointermove',e=>{if(!st)return;const dx=e.clientX-st.x,dy=e.clientY-st.y;

function autoMarkFrom(L,len){
  if(!autoOn||!notesKey)return;
  notes.auto=notes.auto||[]; const no=new Set(), yes=new Set(); let changed=false;
  for(const x of L){
    if(x.hint||x.A==null||notes.auto.includes(x.n))continue;
    notes.auto.push(x.n); changed=true;
    const ds=[...new Set(String(x.g).split(''))];
    if(x.A+x.B===0) ds.forEach(d=>{if(notes.d[+d]!==2){notes.d[+d]=2;no.add(d);}});
    else if(x.A+x.B===len){ds.forEach(d=>{if(notes.d[+d]!==1){notes.d[+d]=1;yes.add(d);}});for(let d=0;d<10;d++)if(!ds.includes(String(d))&&notes.d[d]!==2){notes.d[d]=2;no.add(String(d));}}
  }
  if(!changed)return;
  saveNotes(); renderNotes();
  const msg=[]; if(yes.size)msg.push(`標出 ${[...yes].sort().join('、')}`); if(no.size)msg.push(`劃掉 ${[...no].sort().join('、')}`);
  if(msg.length) setTimeout(()=>toast('筆記已自動'+msg.join('，')),50);
}

function renderChat(){
  const box=document.getElementById('msgs'); const chat=visibleChat();
  if(!chat.length){box.innerHTML='<div class="empty-h">還沒有訊息，來嗆一下大家吧</div>';return;}

function pushPop(name,text){if(ls.get('ab_mute')==='1')return;popQ.push({name,text});if(popQ.length>6)popQ.shift();pumpPop();}
function pumpPop(){
  const box=document.getElementById('stack');
  while(popOn<POP_MAX&&popQ.length){
    const m=popQ.shift(); popOn++;
    const el=document.createElement('div'); el.className='bub';
    el.innerHTML=`<small>${esc(m.name)}</small><b>${esc(m.text)}</b>`;
    box.appendChild(el);
    setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();popOn--;pumpPop();},350);},POP_MS);
  }
}

async function joinRoom(c,watch){
  const n=readNick(); if(!n){homeErr='請先輸入暱稱';return render();}
  c=(c||'').trim().toUpperCase(); if(baseMe) me=ls.get('ab_alias_'+c)||baseMe; if(!/^[A-Z0-9]{4}$/.test(c)){homeErr='邀請碼是 4 個英文或數字';return render();}
  homeErr=''; busy=true; render();
  await act(async()=>{
    const sn=await roomRef(c).get();
    if(!sn.exists){if(ls.get('ab_room')===c)ls.del('ab_room');homeErr=`找不到房間 ${c}，請確認邀請碼`;return;}
    if(sn.data().ver!==APP_VERSION){homeErr=`房間 ${c} 是舊版本建立的，請房主重新開房`;return;}
    const d=sn.data(), cnt=Object.values(d.seats||{}).filter(Boolean).length;
    if(watch&&!(d.seats||{})[me]){
      if(Object.values(d.watchers||{}).filter(Boolean).length>=20){homeErr='觀眾太多了，等一下再來';return;}
      await roomRef(c).update({watchers:{[me]:{name:n,look:lookStr(myLook()),joinedAt:Date.now()}}});
      enterRoom(c);return;
    }
    if((d.watchers||{})[me]&&!(d.seats||{})[me]&&!watch&&ls.get('ab_watch')===c){enterRoom(c);return;}
    if(!(d.seats||{})[me]){
      const same=Object.entries(d.seats||{}).filter(([id,v])=>v&&v.name===n&&id!==me);
      if(same.length===1&&confirm(`房間裡已經有「${n}」，是你剛剛斷線或重新整理嗎？\n\n按「確定」接回原本的位子（題目和猜過的紀錄都會保留）\n按「取消」用新的身分加入`)){
        me=same[0][0]; ls.set('ab_alias_'+c,me); toast('已接回原本的位子'); enterRoom(c); return;}
      if(cnt>=MAXP){homeErr='這個房間人數已滿';return;}
      await roomRef(c).update({seats:{[me]:{name:n,ready:false,joinedAt:Date.now(),look:lookStr(myLook())}}});
    } else await roomRef(c).update({seats:{[me]:{look:lookStr(myLook())}}});

  });

}
function enterRoom(c){
  unsubs.forEach(u=>{try{u();}catch(e){}}); unsubs=[];
  code=c; R=null; roomMissing=false; guesses=[]; secrets=[]; chat=[]; chatLoaded=false; chatStart=Date.now();
  mySecret=null; input=''; err=''; view=null; scored.clear(); notesKey=null;
  ls.set('ab_room',c);
  unsubs.push(roomRef(c).onSnapshot(snap=>{
    if(!snap.exists){roomMissing=true;R=null;return render();}
    applyRoom(snap.data()); render(); renderChat(); autoScore();
  },()=>{noAccess='連線中斷，請重新整理頁面。';render();}));
  unsubs.push(db.collection(`rooms/${c}/chat`).orderBy('at','desc').limit(30).onSnapshot(snap=>{
    const seen=new Set(chat.map(m=>m.id));
    chat=snap.docs.map(x=>({id:x.id,...x.data()})).reverse();
    if(chatLoaded) for(const m of chat){ if(!seen.has(m.id)&&m.pid!==me&&m.at>chatStart&&m.at>=((R&&R.chatSince)||0)){ if(!chatOpen){pushPop(m.name||'玩家',m.text);unread++;const b=document.getElementById('chatBadge');if(b){b.hidden=false;b.textContent=unread>9?'9+':unread;}} } }
    chatLoaded=true; renderChat();
  },()=>{}));
  fxLoaded=false; fxSeen=new Set();
  unsubs.push(db.collection(`rooms/${c}/fx`).orderBy('at','desc').limit(12).onSnapshot(snap=>{
    for(const d of snap.docs){const x={id:d.id,...d.data()};if(fxSeen.has(x.id))continue;fxSeen.add(x.id);if(fxLoaded&&x.pid!==me&&x.at>fxStart-2000)playFx(x,false);}
    fxLoaded=true;
  },()=>{}));
  unsubs.push(db.collection(`rooms/${c}/secrets`).onSnapshot(snap=>{secrets=snap.docs.map(x=>({id:x.id,...x.data()}));loadSecret();render();},()=>{}));
  unsubs.push(db.collection(`rooms/${c}/guesses`).onSnapshot(snap=>{guesses=snap.docs.map(x=>({id:x.id,...x.data()}));render();autoScore();},()=>{}));
  clearInterval(pollT); pollT=setInterval(()=>pollOnce(false),3000);
  renderChat(); render();
}

/* 備援：即時連線慢時，主動抓最新資料 */
let pollT=null, polling=false;
async function pollOnce(force){
  if(!code||!db||polling||document.hidden)return;
  const st=R?derive().status:'lobby';
  if(!force&&R&&R.phase==='coop')return;
  if(!force&&!['lobby','secret','loading','countdown'].includes(st))return;
  polling=true; const c=code;
  try{
    const jobs=[roomRef(c).get(),db.collection(`rooms/${c}/secrets`).get()];
    if(force||st==='playing') jobs.push(db.collection(`rooms/${c}/guesses`).get());
    const [rs,ss,gs]=await Promise.all(jobs);
    if(c!==code)return;
    if(rs.exists) applyRoom(rs.data());
    secrets=ss.docs.map(x=>({id:x.id,...x.data()}));
    if(gs) guesses=gs.docs.map(x=>({id:x.id,...x.data()}));
    loadSecret(); render(); autoScore();
  }catch(e){}
  finally{polling=false;}
}

function derange(ids){
  if(ids.length<2)return{};
  let p;
  do{p=ids.slice();for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}}while(p.some((x,i)=>x===ids[i]));
  const m={};ids.forEach((id,i)=>m[id]=p[i]);return m;
}
let acking=0, starting=0, tickT=null;
async function syncStep(D){
  const s=g(); if(!code||!R)return;
  if(D.status==='loading'&&me in D.A&&secretOf(D.A[me])!=null&&((s.seats[me]||{}).ack!==s.round)&&Date.now()-acking>3000){
    acking=Date.now();
    try{await roomRef().update({seats:{[me]:{ack:s.round}}});}catch(e){acking=0;}
  }
  if(D.status==='loading'&&!s.startAt&&D.parts.length&&D.acked.length===D.parts.length&&Date.now()-starting>3000){
    starting=Date.now();
    try{await roomRef().update({startAt:Date.now()+3000});}catch(e){starting=0;}
  }
  clearTimeout(tickT);
  if(D.status==='loading') tickT=setTimeout(()=>{if(derive().status==='loading')render();},3200);
  if(D.status==='countdown'){const ms=(s.startAt-Date.now())%1000;tickT=setTimeout(render,(ms>0?ms:1000)+30);}
}

/* ===== 像素風角色引擎 ===== 每格一個字元，'.' 不動、'_' 擦掉；外框自動補 */
const PXO='#1e1b2e', PXS=5;
function shadeC(h,f){let n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,k=Math.abs(f);r=Math.round(r+(t-r)*k);g=Math.round(g+(t-g)*k);b=Math.round(b+(t-b)*k);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function pxPut(M,rows,pal,ox,oy){rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const c=r[x];if(c==='.')continue;const k=(x+(ox||0))+','+(y+(oy||0));if(c==='_')M.delete(k);else if(pal[c])M.set(k,pal[c]);}});return M;}
const pxCells=M=>[...M].map(([k,c])=>{const i=k.indexOf(',');return{x:+k.slice(0,i),y:+k.slice(i+1),c};});
function pxBox(M){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const k of M.keys()){const i=k.indexOf(','),x=+k.slice(0,i),y=+k.slice(i+1);if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}return{x0:a,y0:b,x1:c,y1:d};}
function pxOutline(M){const O=new Map();for(const k of M.keys()){const i=k.indexOf(','),x=+k.slice(0,i),y=+k.slice(i+1);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const q=(x+dx)+','+(y+dy);if(!M.has(q))O.set(q,PXO);});}return O;}

function charSVG(x,feetY,name,color,o){
  o=o||{}; const s=o.scale||1, fs=Math.min(12,34/Math.max(2,[...name].reduce((n,c)=>n+(c.charCodeAt(0)<256?.55:1),0)));

function stageSVG(list){
  const n=list.length; if(!n) return '';
  const s=n<=3?1:n<=5?.85:n<=7?.72:.64, W=360, feet=152, gap=W/(n+1), X=i=>n===2?[W*.24,W*.52][i]:gap*(i+1);
  let out='';

    out+=charSVG(X(i),feet,p.name,p.color||PCOL[i%PCOL.length],{look:p.look,boss:p.boss,prop:p.prop,scale:p.boss?Math.min(1.1,s+.2):s,target:isMe?null:p.id,who:p.id,cls:isMe?'me':''});

  return `<svg class="stage" viewBox="0 ${feet-150} ${W} 172" role="img" aria-label="玩家角色"><ellipse cx="${W/2}" cy="${feet+3}" rx="${n===1?54:W/2-10}" ry="6" fill="#000" opacity=".2"/>${out}</svg>`;

function scene(ws,ls,line,label,opt){ opt=opt||{};
  const W=360, ground=246, per=4, layers=[];
  for(let i=0;i<ls.length;i+=per) layers.push(ls.slice(i,i+per));
  if(!layers.length) layers.push([]);
  let gs='', idx=0;
  layers.forEach((row,k)=>{
    const y=ground-24-k*26, step=Math.min(86,(W-30)/Math.max(1,row.length));
    const x0=W/2-step*(row.length-1)/2-(row.length>1?14*(k%2?-1:1):0);
    row.forEach((p,j)=>{gs+=svgLying(x0+j*step,y,p.name,p.color,k%2===1,idx++,p.gave,p.prop,p.look,p.who);});
  });
  const layerTop=ground-24-(layers.length-1)*26-18;
  let w='', topY, bx, by;
  if(ws.length){
    const wstep=Math.min(90,(W-80)/ws.length), wx0=W/2-wstep*(ws.length-1)/2;
    ws.forEach((p,i)=>{w+=svgWinner(wx0+i*wstep,layerTop,p.name,p.color,i,p.boss,p.prop,p.look,p.who,p.tg);});
    topY=layerTop-128-54; bx=W/2-60; by=topY+2; opt._tx=wx0;
  } else { topY=layerTop-56; bx=W/2-50; by=topY+4; }
  const bw=Math.min(W-8,[...line].length*13+20);
  bx=ws.length?W/2-bw/2:bx; bx=Math.max(4,Math.min(bx,W-bw-4));
  const bubble=`<rect x="${bx}" y="${by}" width="${bw}" height="28" rx="12" fill="#fff"/><path d="M${opt._tx!=null?Math.max(bx+14,Math.min(bx+bw-14,opt._tx)):bx+10} ${by+26} l-6 11 l12 -11z" fill="#fff"/><text x="${bx+10}" y="${by+19}" font-size="13" fill="#1b2331" stroke="#1b2331" stroke-width=".55" font-family="Cubic11,Noto Sans TC,sans-serif">${esc(line)}</text>`;
  const vbTop=topY-18;
  return `<svg class="podium" ${opt.ai?`data-ai="${esc(opt.ai)}" data-aik="${esc(label+line)}"`:''} viewBox="0 ${vbTop} ${W} ${ground+14-vbTop}" role="img" aria-label="${esc(label)}"><ellipse cx="${W/2}" cy="${ground+2}" rx="${W/2-10}" ry="7" fill="#000" opacity=".25"/>${gs}${w}${bubble}</svg>`;
}
function podium(D){
  if(!D.parts.length)return'';
  const col=id=>PCOL[D.parts.indexOf(id)%PCOL.length];
  const ws=D.rank.filter(r=>r.place===1).map(r=>({who:'p:'+r.id,tg:r.id!==me&&isSeated(me),name:nameOf(r.id),color:col(r.id),look:lookOf(r.id)}));
  const ls=D.rank.filter(r=>r.place!==1).map(r=>({who:'p:'+r.id,name:nameOf(r.id),color:col(r.id),look:lookOf(r.id),gave:D.out[r.id]==='gave'}));
  const line=ws.length?LINES[hashStr(code+'_'+g().round)%LINES.length]:'全軍覆沒…';
  return scene(ws,ls,line,ws.length?ws.map(p=>p.name).join('、')+' 踩在其他人身上':'大家都趴在地上')+(ws.length&&ls.length&&ws.some(p=>p.tg)?podBar():'');
}
function resultText(D){
  if(!D.parts.length)return'';
  const top=D.rank.filter(r=>r.place===1);
  if(!top.length)return'沒有人猜中';
  const nm=top.map(r=>nameOf(r.id)).join('、');
  return (top.length>1?`${nm} 並列第一`:`${nm} 獲勝`)+`（${top[0].c} 次猜中）`;
}

const arms={};

async function useHint(){
  if(solo) return soloHint();
  if(R&&g().phase==='coop') return coopHint();
  const D=derive(), s=g(); if(!D.can(me))return;
  const os=secretOf(D.A[me]); if(!os){toast('還沒收到題目，暫時不能用提示');return;}
  const got=new Set(D.by[me].filter(x=>x.hint).map(x=>+x.pos));
  const free=[...Array(s.len).keys()].filter(i=>!got.has(i));
  if(free.length<=1){toast('提示最多用到只剩最後一位');return;}
  if(!D.hc)return;
  const pos=await pickPos(free,s.len,knownOf(D.by[me],s.len),`這次提示算 ${D.hc} 次猜測`); if(pos==null)return;
  if(!derive().can(me))return; const digit=os[pos], n=D.by[me].length+1;
  await act(()=>db.collection(`rooms/${code}/guesses`).doc(`r${s.round}_${me}_${n}`).set({round:s.round,pid:me,target:D.A[me],n,hint:true,pos,g:digit,at:Date.now()}));
  notes.pos[pos]=digit; notes.d[+digit]=1; saveNotes(); renderNotes(); render();
  toast(`提示：第 ${pos+1} 位是 ${digit}`);
}

async function wipe(c,name,keepFn){
  try{const s=await db.collection(`rooms/${c}/${name}`).get();
    await Promise.all(s.docs.filter(d=>keepFn(d.data()||{})).map(d=>db.doc(`rooms/${c}/${name}/${d.id}`).delete().catch(()=>{})));}catch(e){}
}

  if(Date.now()-closeArm>4000){closeArm=Date.now();const b=document.getElementById('closeRoom');if(b)b.textContent='確定要關閉？再按一次';setTimeout(()=>{const b=document.getElementById('closeRoom');if(b)b.textContent='關閉房間';},4000);return;}

  }catch(e){busy=false;noAccess=`關閉失敗，請稍後再試（${(e&&(e.code||e.message))||'unknown'}）`;render();}

async function submit(){
  const e=validate(input); if(e){err=e;return render();}
  if(solo) return soloGuess();
  if(R&&g().phase==='coop'){busy=true;render();await coopSubmit();busy=false;return render();}
  const s=g(), D=derive(); if(!isSeated(me))return;
  busy=true; render();
  if(D.status==='secret'&&me in D.A&&!hasSecret(me)){
    const v=input;
    await act(async()=>{
      await db.collection(`rooms/${code}/secrets`).doc(`r${s.round}_${me}`).set({round:s.round,pid:me,c:enc(v,s.round,me)});
      mySecret={round:s.round,s:v}; ls.set('ab_secret_'+code,JSON.stringify(mySecret));
      input=''; peek=false;
    });
  } else if(D.can(me)){
    const n=D.by[me].length+1, tgt=D.A[me];
    const os=secretOf(tgt), r=os?score(os,input):{A:null,B:null};
    const doc={round:s.round,pid:me,target:tgt,n,g:input,A:r.A,B:r.B,at:Date.now()};
    await act(async()=>{await db.collection(`rooms/${code}/guesses`).doc(`r${s.round}_${me}_${n}`).set(doc);input='';});
  }
  busy=false; render();
}
async function autoScore(){
  const s=g(); if(!mySecret||mySecret.round!==s.round) return;
  for(const x of guesses){
    if(x.round===s.round&&x.target===me&&!x.hint&&x.A==null&&!scored.has(x.id)){
      scored.add(x.id); const r=score(mySecret.s,x.g);
      try{await db.collection(`rooms/${code}/guesses`).doc(x.id).update({A:r.A,B:r.B});}catch(e){scored.delete(x.id);}
    }
  }
}
function loadSecret(){
  if(!R)return; if(mySecret&&mySecret.round===R.round)return;
  try{const d=JSON.parse(ls.get('ab_secret_'+code)||'null');if(d&&d.round===R.round){mySecret=d;return;}}catch(e){}
  const own=secretOf(me); if(own) mySecret={round:R.round,s:own};
}

const WCACHE={};
function deduce(list,len,rep){
  const key=len+'|'+(rep?1:0)+'|'+list.map(x=>x.hint?'h'+x.pos+x.g:x.g+(x.A==null?'?':x.A+''+x.B)).join(',');
  if(WCACHE[key])return WCACHE[key];
  let c=allCands(len,rep);const flags=[],why=[],seen=[];
  for(let i=0;i<list.length;i++){const x=list[i];
    if(x.hint){c=c.filter(v=>v[+x.pos]===x.g);flags.push('');why.push('');seen.push(x);continue;}
    let bad='';
    if(!c.includes(x.g)){
      for(let j=0;j<seen.length;j++){const y=seen[j];
        if(y.hint){if(x.g[+y.pos]!==y.g){bad=`提示說第 ${(+y.pos)+1} 位是 ${y.g}，但這次第 ${(+y.pos)+1} 位放了 ${x.g[+y.pos]}`;break;}continue;}
        if(y.A==null)continue;const r=score(x.g,y.g);
        if(r.A!==y.A||r.B!==y.B){bad=`跟第 ${list.indexOf(y)+1} 次矛盾：如果答案是 ${x.g}，當時猜 ${y.g} 會得到 ${r.A}A${r.B}B，但實際是 ${y.A}A${y.B}B`;break;}}
      if(!bad)bad='跟前面的線索合起來不可能成立';}
    flags.push(bad?'imp':'');why.push(bad);
    if(x.A!=null)c=c.filter(v=>{const r=score(v,x.g);return r.A===x.A&&r.B===x.B;});
    seen.push(x);}
  const yes=[],no=[],pos=[];
  if(c.length){for(let d=0;d<10;d++){const D=String(d),k=c.filter(v=>v.includes(D)).length;if(k===c.length)yes.push(D);else if(!k)no.push(D);}
    for(let p=0;p<len;p++){const d0=c[0][p];if(c.every(v=>v[p]===d0))pos.push([p,d0]);}}
  return WCACHE[key]={flags,why,left:c.length,few:c.length<=4?c:null,yes,no,pos};
}
function factsText(W){const t=[];

  if(W.yes.length)t.push(`確定有 ${W.yes.join('、')}`);
  if(W.no.length)t.push(`確定沒有 ${W.no.join('、')}`);
  return t.join('；');}
function watchHist(id,list,tid){

    :`<div class="hrow ${W.flags[i]?'improw':''}"><span class="hn">${i+1}</span><span class="hg">${esc(r.g)}${W.flags[i]?'<small class="imp">不可能</small>':''}</span><span class="score">${r.A==null?'<span class="W"><span class="dot"></span>計算中</span>':ab(r)}</span>${W.why[i]?`<span class="whyl">${esc(W.why[i])}</span>`:''}</div>`).join('')+'</div>';

const TAUNT=['還沒猜到喔？','我等你😴','慢慢來，反正沒人在等你','這題很簡單吧🤔','你是不是在亂猜😏'];
/* 魔王的猜題邏輯：只用自己猜過的幾A幾B來推理 */
const ALLC={};
function allCands(len,rep){
  const k=len+(rep?'r':''); if(ALLC[k])return ALLC[k];
  const out=[], rec=(s)=>{if(s.length===len){out.push(s);return;}for(let d=0;d<10;d++){const c=String(d);if(!rep&&s.includes(c))continue;rec(s+c);}};
  rec(''); return ALLC[k]=out;
}
const fits=(c,clues)=>clues.every(x=>{const r=score(c,x.g);return r.A===x.A&&r.B===x.B;});
const PROBES={3:['123','456','789'],4:['1234','5678'],5:['12345','67890']};
function cpuPick(s){
  const all=allCands(s.len,s.rep), clues=s.chist;
  let cands=all.filter(c=>fits(c,clues));
  if(!cands.length) cands=all;
  if(s.diff!=='hard'){
    // 像人一樣：先用 1234、5678 篩數字
    const pr=(PROBES[s.len]||[]).slice(0,s.diff==='easy'?1:9);
    const found=clues.reduce((t,x)=>PROBES[s.len]&&PROBES[s.len].includes(x.g)?t+x.A+x.B:t,0);
    if(clues.length<pr.length&&found<s.len&&!clues.some(x=>x.g===pr[clues.length])) return {g:pr[clues.length],left:cands.length};
    // 之後只記得最近幾次的線索（人會漏看舊的）
    const k=s.diff==='easy'?2:(Math.random()<.5?2:3), loose=all.filter(c=>fits(c,clues.slice(-k)));
    return {g:pick(loose.length?loose:cands),left:cands.length};
  }
  if(cands.length>2){
    const sample=a=>{if(a.length<=260)return a;const o=[];for(let i=0;i<260;i++)o.push(a[Math.floor(Math.random()*a.length)]);return o;};
    const tests=sample(cands).slice(0,140), targets=sample(cands);
    let best=null,bv=1e9;
    for(const t of tests){const m={};let w=0;for(const c of targets){const r=score(c,t);const k=r.A*10+r.B;m[k]=(m[k]||0)+1;if(m[k]>w)w=m[k];}if(w<bv){bv=w;best=t;}}
    return {g:best,left:cands.length};
  }
  return {g:pick(cands),left:cands.length};
}
function cpuThink(s,last){
  if(!last) return '先猜一個試試看';
  const clues=(s.chist||[]).concat([last]);
  if(s.diff==='easy'&&Math.random()<.5) return pick(['嗯…讓我想想','應該是這樣吧？','感覺快猜到了','我猜猜看']);
  const c=allCands(s.len,s.rep).filter(x=>fits(x,clues)), yes=[], no=[];
  for(let d=0;d<10;d++){const D=String(d), k=c.filter(x=>x.includes(D)).length; if(c.length&&k===c.length)yes.push(D); else if(!k)no.push(D);}
  const hit=last.A+last.B;
  if(last.A===s.len) return `${last.g}，猜中了！`;
  const cc=allCands(s.len,s.rep).filter(x=>clues.every(q=>{const r=score(x,q.g);return r.A+r.B===q.A+q.B;}));
  const noCnt=[];for(let d=0;d<10;d++){const D=String(d);if(cc.length&&!cc.some(x=>x.includes(D)))noCnt.push(D);}
  let t=hit===0?`${[...new Set(last.g)].join('、')} 都不在`:hit===s.len?`${last.g} 的數字全對，只差位置`:`${last.g} 裡有 ${hit} 個數字是對的`;
  const P=PROBES[s.len]||[], pc=clues.filter(x=>P.includes(x.g));
  if(pc.length===P.length&&P.includes(last.g)&&s.len===4){const sum=pc.reduce((t,x)=>t+x.A+x.B,0),rest=s.len-sum; if(rest>0) t+=`，所以 9、0 裡有 ${rest} 個`;}
  if(yes.length&&yes.length<s.len+1) t+=`；確定有 ${yes.join('、')}`;
  if(no.length&&hit!==0){const byPos=no.filter(d=>!noCnt.includes(d));t+=`；確定沒有 ${no.join('、')}`+(byPos.length?`（${byPos.join('、')} 是對照位置推出來的：放進去會和前面的 A 衝突）`:'');}
  if(c.length<=1) t+='。我知道答案了';
  else if(s.diff==='hard'||c.length<=6) t+=`（還剩 ${c.length} 種可能）`;
  return t;
}
function soloDone(){
  const s=solo, n=s.hist.length, me=s.hist.some(x=>!x.hint&&x.A===s.len);
  if(s.mode!=='duel'){ if(me){s.result='win';s.end=Date.now();} return; }
  if(s.chist.length<n) return;
  const cpu=s.chist.some(x=>x.A===s.len);
  if(me||cpu){s.result=me&&cpu?'tie':me?'win':'lose';s.end=Date.now();}
}
function cpuTurn(){
  const s=solo; if(!s||s.result||s.mode!=='duel')return;
  s.cpuBusy=true; render();
  setTimeout(()=>{
    if(solo!==s||s.result)return;
    const {g:gg,left}=cpuPick(s), r=score(s.mine,gg);
    const left2=allCands(s.len,s.rep).filter(c=>fits(c,s.chist.concat([{g:gg,A:r.A,B:r.B}]))).length;
    s.chist.push({n:s.chist.length+1,g:gg,A:r.A,B:r.B,think:cpuThink(s,{g:gg,A:r.A,B:r.B},left2)});
    s.cpuBusy=false; soloDone();
    if(!s.result&&Math.random()<.35){pushPop(s.vil.n,pick(s.vil.all||[s.vil.says])); setTimeout(()=>playFx({target:'you',from:'boss',item:pick(['tomato','egg','slipper']),n:1},true),500);}
    render();
  },900+Math.random()*700);
}
function soloGuess(){
  const s=solo;
  if(s.phase==='setup'){s.mine=input;s.phase='play';s.start=Date.now();input='';err='';peek=false;render();window.scrollTo(0,0);return;}
  if(s.cpuBusy||s.result||(s.mode==='duel'&&s.chist.length<s.hist.length))return;
  const g2=input, r=score(s.secret,g2); s.hist.push({n:s.hist.length+1,g:g2,A:r.A,B:r.B});
  input=''; err='';
  if(s.mode==='duel'){ cpuTurn(); return; }
  soloDone();
  if(false) pushPop(s.vil.n,Math.random()<.5?pick(s.vil.all||[s.vil.says]):pick(TAUNT));
  render();
}
async function soloHint(){
  const s=solo; if(s.result||s.cpuBusy||s.phase!=='play')return;
  const got=new Set(s.hist.filter(x=>x.hint).map(x=>+x.pos)), free=[...Array(s.len).keys()].filter(i=>!got.has(i));

}

  s.end=Date.now(); s.result='gave'; render();
}
/* 結算詳解：把魔王每一步重算一次，只用當時的幾A幾B，用白話講給一般人看 */
let explainOpen=false;
function cpuExplain(s){const all=allCands(s.len,s.rep),L=s.chist,len=s.len,n=s.vil.n;let left=all;
  const plain=x=>{const hit=x.A+x.B,ds=[...new Set(x.g)].join('、');
    if(x.A===len)return '全部都對，猜中了！';
    if(!hit)return `${ds} 全都不在答案裡。`;
    const head=hit===len?`這 ${len} 個數字全部都對`:`這 ${len} 個數字裡有 ${hit} 個是對的`;
    return head+(x.A&&x.B?`，其中 ${x.A} 個位置也對、${x.B} 個位置不對。`:x.A?`，而且位置都對${hit<len?`，另外 ${len-hit} 個不在答案裡`:''}。`:'，但位置都不對。');};
  const known=c=>{const yes=[],no=[];for(let d=0;d<10;d++){const D=String(d),k=c.filter(x=>x.includes(D)).length;if(k===c.length)yes.push(D);else if(!k)no.push(D);}
    const pos=[];for(let i=0;i<len;i++){const D=c[0][i];pos.push(c.every(x=>x[i]===D)?D:'');}
    const t=[];if(yes.length)t.push(`一定有 ${yes.join('、')}`);if(no.length)t.push(`一定沒有 ${no.join('、')}`);
    if(!t.length&&!pos.some(Boolean))return '';
    return `<div class="exk">${pos.some(Boolean)?`<span class="hrow">${pos.map(d=>`<i class="${d?'ha':''}">${d||'?'}</i>`).join('')}</span>`:''}${t.length?`<span>現在知道：${t.join('；')}</span>`:''}</div>`;};
  const rows=L.map((x,i)=>{const before=left,legal=before.includes(x.g),after=before.filter(c=>fits(c,[x])),gone=before.filter(c=>!fits(c,[x])),win=x.A===len;left=after;
    const ex=gone.length?gone[Math.floor(gone.length/2)]:'', r=ex?score(ex,x.g):null;
    const eg=ex&&!win?`<p class="exw">怎麼刪的：如果答案是 ${ex}，猜 ${x.g} 應該得到 ${r.A}A${r.B}B，和這次的結果對不上，所以刪掉。${esc(n)}把 ${before.length} 種都這樣比一遍。</p>`:'';
    const note=win?(before.length===1?'前面已經刪到只剩這一種，所以一定中。':`當時還有 ${before.length} 種可能，它從裡面挑一個就中了，這次是運氣好（機率 1/${before.length}）。`):legal?'':'它忘了比較舊的線索，這個數字其實已經不可能了，所以這一步是浪費的。';
    return `<li><div class="exh"><span class="hn">第 ${i+1} 次</span><b>${esc(x.g)}</b><span class="score"><span class="A">${x.A}A</span><span class="B">${x.B}B</span></span>${win?'':`<span class="exn">剩 ${after.length} 種</span>`}</div>
      <p class="exp">${plain(x)}</p>${note?`<p class="exw">${note}</p>`:''}${eg}${win||!after.length?'':known(after)}</li>`;}).join('');
  return `<div class="expl"><p class="exi">${esc(n)}的做法很單純：先列出全部 ${all.length} 種可能，每猜一次，就把對不上結果的刪掉，再從剩下的挑一個。它只用幾A幾B，沒有看你的題目。</p><ol>${rows}</ol></div>`;}
function cpuHistHTML(L){
  if(!L.length)return'<div class="empty-h">魔王還沒猜</div>';
  return'<div class="hist">'+L.map((r,i)=>`<div class="hrow"><span class="hn">${i+1}</span><span class="hg">${esc(r.g)}</span><span class="score">${ab(r)}</span></div>${r.think?`<div class="think">💭 ${esc(r.think)}</div>`:''}`).join('')+'</div>';
}
function renderSolo(){
  const s=solo, duel=s.mode==='duel', nk='solo_'+s.id, used=s.hist.filter(x=>x.hint).length;
  const vil=s.vil, stLabel=s.stage==='custom'?'自訂魔王':(STAGES[s.stage]||{label:''}).label;
  let h=`<header class="roomhead"><div style="min-width:0"><div class="titlerow"><h1>邊緣人模式</h1><button class="helpbtn" type="button" data-help>？</button></div><p class="sub">${duel?`挑戰 · ${{easy:'簡單',normal:'普通',hard:'困難'}[s.diff]}`:'練習'} · ${s.len} 位數 · ${s.rep?'可重複':'不重複'} · ${esc(stLabel)}</p></div></header>`;
  if(s.phase==='setup'){
    h+=`<div class="card vil"><span class="vicon">${vilIcon(vil)}</span><div><span class="lbl">你的對手：${esc(vil.n)}</span><p>「${esc(vil.says)}」</p></div></div>
      <div class="card"><h2>出一題給${esc(vil.n)}猜</h2><p class="sub">${s.len} 位數，${s.rep?'數字可以重複':'數字不能重複'}。${esc(vil.n)}也已經出好一題給你了。</p>${slots(true)}<div class="peekrow"><button class="peek" id="peek">${peek?'隱藏數字':'顯示數字'}</button><button class="peek" id="randSecret">🎲 隨機出題</button></div><p class="err">${esc(err)}</p>${pad(false)}</div>
      <button class="peek" id="soloQuit">回首頁</button>`;
    paint(h); sideUI(false,false); return;
  }
  if(notesKey!==nk||notesLen!==s.len) loadNotes(nk,s.len);
  autoMarkFrom(s.hist,s.len);
  if(!s.result){
    if(duel) h+=`<div class="card vil"><span class="vicon">${vilIcon(vil)}</span><div><span class="lbl">${duel?'對手':'今天的魔王'}：${esc(vil.n)}</span><p>「${esc(vil.says)}」</p></div></div>
      <div class="card">${stageSVG([{id:'you',name:'你',self:true,color:'#f2b544',look:myLook()},{id:'boss',name:vil.n,boss:true,prop:vil.p,color:vil.c}])}${itemBar('solo')}</div>`;
    const hl=s.len-1-used, waiting=duel&&(s.cpuBusy||s.chist.length<s.hist.length);
    const meDone=s.hist.some(x=>!x.hint&&x.A===s.len);
    if(waiting) h+=`<div class="card center"><h2>${esc(vil.n)}思考中<span class="dots"></span></h2><p class="hand">${meDone?`你猜中了！看${esc(vil.n)}這回合能不能追平`:'輪到魔王猜你的題目'}</p></div>`;
    h+=`<div class="card"><h2>${duel?`第 ${s.hist.length+(waiting?0:1)} 回合 · `:''}你猜${esc(vil.n)}的題</h2>${s.hist.length?`<div class="mine-h" id="mineH">${histHTML(s.hist)}</div>`:''}`+
      (waiting?'':`${slots(false)}<p class="err">${esc(err)}</p>${pad(true)}
      <div class="tools"><button class="btn ghost small" id="hintBtn" ${hl<=0?'disabled':''}>提示 ×${Math.max(0,hl)}</button><button class="btn ghost small" id="soloAngel" ${(s.angels||0)>=3?'disabled':''}>小天使 ×${3-(s.angels||0)}</button><button class="btn ghost small" id="giveUp">放棄</button></div>`)+`</div>`;
    if(duel) h+=`<div class="card lcol"><span class="lbl">${esc(vil.n)}猜你的題（你的題目：<b class="secret" style="font-size:16px">${esc(s.mine)}</b>）</span>${cpuHistHTML(s.chist)}</div>`;
    h+=`<button class="peek" id="soloQuit">回首頁</button>`;
  } else {
    const r=s.result, n=s.hist.length;
    const title=!duel?(r==='win'?`${n} 次猜中！`:'下次再來'):r==='win'?`你贏了！`:r==='tie'?'平手！':r==='lose'?`${esc(vil.n)}贏了…`:'下次再來';
    const sub=r==='win'?`${n} 次猜中${duel?`，${esc(vil.n)}還沒猜到`:''}`:r==='tie'?`你們都在第 ${n} 回合猜中`:r==='lose'?`${esc(vil.n)}第 ${s.chist.length} 次就猜中你的題目`:`猜了 ${n} 次`;
    const pic=!duel?'':r==='win'?scene([{who:'p:you',name:'你',color:'#f2b544',look:myLook()}],[{who:'p:boss',name:vil.n,color:vil.c,prop:vil.p}],vil.back,'你踩在'+vil.n+'身上',{ai:'p:boss|p:you'})
      :r==='tie'?scene([{name:'你',color:'#f2b544',look:myLook()},{name:vil.n,color:vil.c,boss:true,prop:vil.p}],[],'下一局分勝負','平手')
      :scene([{who:'p:boss',tg:true,name:vil.n,color:vil.c,boss:true,prop:vil.p}],[{who:'p:you',name:'你',color:'#f2b544',look:myLook()}],vil.says2,vil.n+'踩在你身上')+podBar();
    h+=`<div class="card center" style="padding-block:24px"><h1>${title}</h1><p class="hand">${sub}${used?`（用了 ${used} 次提示）`:''}，花了 ${fmtTime(s.end-s.start)}</p>${pic}
      <div class="reveal" style="width:100%"><div><span class="sub">${duel?esc(vil.n)+'的題目':'答案'}</span><b>${esc(s.secret)}</b></div>${duel?`<div><span class="sub">你的題目</span><b>${esc(s.mine)}</b></div>`:''}</div></div>
      <div class="card"><span class="lbl">${duel?`你猜${esc(vil.n)}的題`:'這局的紀錄'}</span>${histHTML(s.hist)}</div>
      ${duel?`<div class="card"><span class="lbl">${esc(vil.n)}猜你的題</span>${cpuHistHTML(s.chist)}<button class="btn ghost" id="explainBtn">${explainOpen?'收起詳解':`看${esc(vil.n)}是怎麼推理的`}</button>${explainOpen?cpuExplain(s):''}</div>`:''}
      <button class="btn" id="soloAgain">再玩一局</button><button class="peek" id="soloQuit">回首頁</button>`;
  }
  paint(h); sideUI(false,!s.result);
}
solo=null; ls.del('ab_solo');

setTimeout(()=>{if(!db)render();},11000);
</script>
