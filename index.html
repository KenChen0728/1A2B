/* iPhone 上下邊，和排球記錄表同一套做法（都在 iPhone 實機確認過）。主畫面 App 有兩種狀況：
   一、從狀態列後面開始畫（上 inset 大於 0）：系統蓋的模糊關不掉，內容要多留 40，模糊才只落在色帶上；開機時 100dvh 會少一截，要用 100lvh 才到螢幕底。
   二、從狀態列下方開始（上 inset 0）：沒有模糊，100lvh 不準，要用 100dvh。下面的 min() 兩種都對。不用 black-translucent。 */
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--vgap:0px;--brand:#1d3a6b;--edge:repeating-linear-gradient(90deg,#d9503e 0 8px,transparent 8px 12px,#f2b544 12px 20px,transparent 20px 24px);color-scheme:light}
.statusband{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--brand);z-index:99;pointer-events:none;overflow:hidden}
.footband{display:none}
html{touch-action:manipulation;overscroll-behavior:none}
body{margin:0;box-sizing:border-box;min-height:100vh;min-height:100dvh;padding-top:var(--safe-top);padding-bottom:var(--safe-bot);overscroll-behavior:none;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
@media (display-mode:standalone){
  :root{--safe-top:calc(env(safe-area-inset-top,0px) + min(40px,calc(env(safe-area-inset-top,0px)*99)));color-scheme:dark}
  /* 不給 html 底色：格子背景會鋪滿整個螢幕，內容比螢幕矮時，下方色帶上面才不會露出一段深藍 */
  body{color-scheme:var(--cs,light)}
  .statusband{height:max(6px,var(--safe-top))}
  .statusband::after,.footband::before{content:"";position:absolute;left:0;right:0;height:4px;background:var(--edge)}
  .statusband::after{bottom:0}
  .footband::before{top:0}
}
@media (display-mode:standalone) and (orientation:portrait){
  .footband{display:block;position:fixed;left:0;right:0;bottom:calc(0px - var(--vgap));height:var(--safe-bot);background:var(--brand);z-index:99;pointer-events:none;overflow:hidden}
}
@media (display-mode:standalone) and (orientation:landscape) and (max-height:500px){.statusband{display:none}}
@supports (height:100lvh){
  @media (display-mode:standalone){
    :root{--app-h:min(100lvh,calc(100dvh + env(safe-area-inset-top,0px)*99));--vgap:calc(var(--app-h) - 100dvh)}
    html,body{min-height:var(--app-h)}
    .drawer,.nback,.upd,.fxl,.hitl,.ghostov{bottom:calc(0px - var(--vgap))!important}
  }
}
img{max-width:100%}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}

<script>
const app=document.getElementById('app');
const APP_VERSION='2026.11.11-1';
/* 房間資料格式的版本：資料結構沒變就不要動它，新舊版手機才能同房。ROOM_MIN 以前的房間格式不確定，不接。 */
const ROOM_VER='2026.11.05-6', ROOM_MIN='2026.11.03-2';
const MAXP=8, CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let baseMe=null, solo=null, why='', db=null, me=null, code=null, R=null, roomMissing=false, guesses=[], secrets=[], chat=[], unsubs=[];
let mySecret=null, input='', err='', homeErr='', peek=false, view=null, nick='', busy=false, scored=new Set(), noAccess='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
/* ab_live：這個分頁現在在玩什麼（'solo' 或房號）。手機切出去被系統重新載入、或按重新整理時，靠它直接回到原本的局 */
const ss={get(k){try{return sessionStorage.getItem(k);}catch(e){return null;}},set(k,v){try{sessionStorage.setItem(k,v);}catch(e){}},del(k){try{sessionStorage.removeItem(k);}catch(e){}}};

function score(secret,guess){
  let A=0;const cs={},cg={};
  for(let i=0;i<secret.length;i++){if(secret[i]===guess[i])A++;cs[secret[i]]=(cs[secret[i]]||0)+1;cg[guess[i]]=(cg[guess[i]]||0)+1;}
  let c=0;for(const d in cg)c+=Math.min(cg[d],cs[d]||0);return{A,B:c-A};
}
function hk(pid){let h=0;for(const ch of String(pid))h=(h*31+ch.charCodeAt(0))%9973;return h;}
function enc(s,r,pid){const k=r*7+hk(pid)*3;return btoa(s.split('').map((d,i)=>String.fromCharCode(65+((+d+k+i*5)%10)+10*((i*7+r)%2))).join('')).split('').reverse().join('');}
function dec(c,r,pid){const k=r*7+hk(pid)*3;try{return atob(c.split('').reverse().join('')).split('').map((ch,i)=>{const v=(ch.charCodeAt(0)-65)%10;return String(((v-(k+i*5))%10+1000000)%10);}).join('');}catch(e){return null;}}

/* 資料庫讀回來的東西一律當成外來資料：數字轉成數字、代號和顏色只收認得的格式，畫面和邏輯都只用清過的資料。
   只在讀取時處理，寫進資料庫的格式完全不變，新舊版手機可以同房。 */
const num=(v,d=0)=>{const n=typeof v==='number'?v:(typeof v==='string'&&v.trim()!=='')?Number(v):NaN;return Number.isFinite(n)?n:d;};
const txt=(v,n=300)=>typeof v==='string'?v.slice(0,n):typeof v==='number'?String(v):'';
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const isMap=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const usage=v=>isMap(v)?{r:num(v.r),n:num(v.n)}:undefined;
function cleanSeat(v){if(!isMap(v)||!txt(v.name,16))return null;const o={...v,name:txt(v.name,16),ready:!!v.ready,joinedAt:num(v.joinedAt),look:txt(v.look,40)};
  for(const k of ['ack','gaveUp','hb','bench'])if(o[k]!=null)o[k]=num(o[k]);
  for(const k of ['an','gh'])if(o[k]!=null)o[k]=usage(o[k]);
  return o;}
const cleanSeats=m=>{const o={};if(isMap(m))for(const id in m)o[id]=cleanSeat(m[id]);return o;};
function cleanVil(v){if(!isMap(v))return undefined;return{...v,n:txt(v.n,12),p:v.p==='dino'||own(PX_VIL,v.p)?v.p:'',c:/^#[0-9a-f]{6}$/i.test(v.c)?v.c:'#9aa3b5',all:Array.isArray(v.all)?v.all.map(x=>txt(x,60)):undefined,says:txt(v.says,60),back:txt(v.back,60),says2:txt(v.says2,60),stage:txt(v.stage,24)};}
function cleanCoop(c){if(!isMap(c))return null;const o={...c,order:Array.isArray(c.order)?c.order.map(x=>txt(x,64)):[],startAt:num(c.startAt),bossC:txt(c.bossC,40),team:txt(c.team,8).replace(/\D/g,''),surrender:!!c.surrender,vil:cleanVil(c.vil)};
  if(c.turnSec!=null)o.turnSec=num(c.turnSec);if(c.an!=null){o.an=usage(c.an);if(o.an&&isMap(c.an)&&c.an.by!=null){o.an.by=txt(c.an.by,64);o.an.k=num(c.an.k,-1);}}
  const n=c.notes;o.notes=isMap(n)?{d:Array.isArray(n.d)?n.d.map(x=>x===1||x===2?x:0):undefined,pos:Array.isArray(n.pos)?n.pos.map(x=>/^\d$/.test(String(x??''))?String(x):''):[],memo:txt(n.memo),auto:Array.isArray(n.auto)?n.auto.filter(x=>typeof x==='number'):[]}:null;
  return o;}
function cleanRoom(d){d=isMap(d)?d:{};const L=num(d.len),o={...d};
  for(const [k,n] of [['ver',24],['host',64],['code',8],['assign',3000],['phase',12],['mode',12],['diff',8],['stage',24]])o[k]=txt(d[k],n);
  o.round=Math.max(1,Math.floor(num(d.round,1)));o.len=L===3||L===5?L:4;o.rep=!!d.rep;o.finish=!!d.finish;o.startAt=num(d.startAt);o.chatSince=num(d.chatSince);
  for(const k of ['turnSec','hintCost','angelN','angelCost'])if(d[k]!=null)o[k]=num(d[k]);
  o.seats=cleanSeats(d.seats);o.watchers=cleanSeats(d.watchers);
  if(isMap(d.lastResult))o.lastResult={round:num(d.lastResult.round),text:txt(d.lastResult.text)};else delete o.lastResult;
  o.coop=cleanCoop(d.coop);return o;}
function cleanGuess(x){if(!/^\d{1,8}$/.test(String(x.g??'')))return null;
  const o={...x,g:String(x.g),round:num(x.round),n:num(x.n),at:num(x.at),pid:txt(x.pid,64),target:txt(x.target,64),kind:txt(x.kind,8),think:txt(x.think,400),hint:!!x.hint,A:x.A==null?null:num(x.A),B:x.B==null?null:num(x.B)};
  if(x.pos!=null)o.pos=num(x.pos);return o;}
const cleanSecret=x=>({...x,round:num(x.round),pid:txt(x.pid,64),c:txt(x.c,40)});
const cleanChat=x=>({...x,pid:txt(x.pid,64),name:txt(x.name,16),text:txt(x.text,60),at:num(x.at)});
function cleanFx(x){const it=txt(x.item,10);if(it!=='ghost'&&it!=='angel'&&!own(PX_ITEM,it))return null;
  return{...x,item:it,pid:txt(x.pid,64),name:txt(x.name,16),target:txt(x.target,70),n:Math.min(20,Math.max(1,Math.floor(num(x.n,1)))),res:txt(x.res,20),text:txt(x.text,300),at:num(x.at)};}
const docsOf=(snap,fn)=>snap.docs.map(x=>fn({id:x.id,...x.data()})).filter(Boolean);

const g=()=>solo||R||{};
function assignMap(){try{return JSON.parse(g().assign||'{}')||{};}catch(e){return{};}}
function players(){const S=g().seats||{};return Object.entries(S).filter(([id,v])=>v&&typeof v==='object').map(([id,v])=>({id,...v})).sort((a,b)=>((a.joinedAt||0)-(b.joinedAt||0))||(a.id<b.id?-1:1));}
const isSeated=id=>!!(id&&g().seats&&g().seats[id]);
const nameBook={}; /* 離開的人座位會清空，名字留一份，畫面才不會變成「玩家」 */
const nameOf=id=>(g().seats&&g().seats[id]&&g().seats[id].name)||(g().watchers&&g().watchers[id]&&g().watchers[id].name)||nameBook[id]||'玩家';
const isWatcher=id=>!!(id&&!isSeated(id)&&g().watchers&&g().watchers[id]);
const watchersList=()=>Object.entries(g().watchers||{}).filter(([id,v])=>v&&typeof v==='object').map(([id,v])=>({id,...v}));
const isHost=()=>g().host===me;
function secretOf(pid){const s=g();const d=secrets.find(x=>x.round===s.round&&x.pid===pid);return d?dec(d.c,d.round,d.pid):null;}
const hasSecret=pid=>secrets.some(x=>x.round===g().round&&x.pid===pid);

function derive(){
  const s=g(), P=players(), A=assignMap(), parts=Object.keys(A), seats=s.seats||{};
  const rg=guesses.filter(x=>x.round===s.round);
  const hc=s.hintCost==null?2:s.hintCost, aN=angelMax(), ac=s.angelCost==null?1:s.angelCost, angels={}, turn={}, cnt={}, by={}, solved={}, solvedAt={}, pend={}, best={}, hints={}, out={};
  parts.forEach(id=>{
    const L=rg.filter(x=>x.pid===id).sort((a,b)=>a.n-b.n); by[id]=L;
    const i=L.findIndex(x=>!x.hint&&x.A===s.len); turn[id]=i<0?0:i+1; solvedAt[id]=i<0?0:L[i].at||0;
    const wt=x=>x.hint?hc:1, an=(seats[id]||{}).an; angels[id]=an&&an.r===s.round?an.n||0:0;
    cnt[id]=L.reduce((t,x)=>t+wt(x),0)+angels[id]*ac; solved[id]=i<0?0:L.slice(0,i+1).reduce((t,x)=>t+wt(x),0)+angels[id]*ac;
    pend[id]=L.find(x=>!x.hint&&x.A==null)||null;
    best[id]=L.filter(x=>!x.hint&&x.A!=null).reduce((b,x)=>(!b||x.A*10+x.B>b.A*10+b.B)?x:b,null);
    hints[id]=L.filter(x=>x.hint).length;
    out[id]=!seats[id]?'left':(seats[id].gaveUp===s.round?'gave':'');
  });
  const live=parts.filter(id=>!out[id]&&!turn[id]);
  const S=parts.filter(id=>turn[id]).reduce((m,id)=>Math.min(m,turn[id]),Infinity);
  const minN=live.length?Math.min(...live.map(id=>by[id].length)):0;
  const allIn=parts.length>0&&parts.every(hasSecret);
  let status;
  if(s.phase!=='secret'&&s.phase!=='playing') status='lobby';
  else if(!allIn) status='secret';
  else if(!parts.every(id=>(seats[id]||{}).ack===s.round||out[id])||!s.startAt) status='loading';
  else if(Date.now()<s.startAt&&s.startAt-Date.now()<8000) status='countdown';
  else if(live.length===0||(!s.finish&&S<Infinity&&live.every(id=>by[id].length>=S))) status='over';

function drawHelp(dir){const P=helpC||(helpC=helpPages()),n=P.length,$=id=>document.getElementById(id);helpP=Math.max(0,Math.min(n-1,helpP));

  $('helpPrev').hidden=T.i===0;$('helpNext').textContent=T.i===T.n-1?'知道了':'下一頁';}
function helpTopic(){const P=helpC,g=P[helpP].g,L=P.map((p,i)=>p.g===g?i:-1).filter(i=>i>=0);return{i:L.indexOf(helpP),n:L.length};}

function autoMarkFrom(L,len){
  if(!autoOn||!notesKey)return;
  notes.auto=notes.auto||[]; const no=new Set(), yes=new Set(); let changed=false;
  for(const x of L){
    if(x.hint||x.A==null||notes.auto.includes(x.n))continue;
    notes.auto.push(x.n); changed=true;
    const ds=[...new Set(String(x.g).split(''))];
    if(x.A+x.B===0) ds.forEach(d=>{if(notes.d[+d]!==2){notes.d[+d]=2;no.add(d);}});
    else if(x.A+x.B===len){ds.forEach(d=>{if(notes.d[+d]!==1){notes.d[+d]=1;yes.add(d);}});for(let d=0;d<10;d++)if(!ds.includes(String(d))&&notes.d[d]!==2){notes.d[d]=2;no.add(String(d));}}
  }
  if(!changed)return;
  saveNotes(); renderNotes();
  const msg=[]; if(yes.size)msg.push(`標出 ${[...yes].sort().join('、')}`); if(no.size)msg.push(`劃掉 ${[...no].sort().join('、')}`);
  if(msg.length&&autoTold!==notesKey&&!L.some(x=>!x.hint&&x.A===len)){autoTold=notesKey;setTimeout(()=>toast('筆記已自動'+msg.join('，')),50);}
}

const SEND_GAP=5000, POP_MAX=3, POP_MS=4500;

function renderChat(){
  const box=document.getElementById('msgs'); const chat=visibleChat();

function pushPop(name,text){if(ls.get('ab_mute')==='1')return;popQ.push({name,text});if(popQ.length>6)popQ.shift();pumpPop();}
function pumpPop(){
  const box=document.getElementById('stack');
  while(popOn<POP_MAX&&popQ.length){
    const m=popQ.shift(); popOn++;
    const el=document.createElement('div'); el.className='bub';
    el.innerHTML=`<small>${esc(m.name)}</small><b>${esc(m.text)}</b>`;
    box.appendChild(el);
    setTimeout(()=>{el.classList.add('out');setTimeout(()=>{el.remove();popOn--;pumpPop();},350);},POP_MS);
  }
}

async function sendChat(text){
  text=(text||'').trim().slice(0,60);
  if(!text||!code||!(isSeated(me)||isWatcher(me))||!db)return false;
  const wait=SEND_GAP-(Date.now()-lastSend);
  if(wait>0){toast(`慢一點，${Math.ceil(wait/1000)} 秒後再傳`);return false;}
  lastSend=Date.now();
  try{await db.collection(`rooms/${code}/chat`).add({pid:me,name:nameOf(me),text,at:Date.now()});return true;}catch(e){lastSend=0;toast('訊息沒送出去，請再試一次');return false;}
}

/* how：'watch' 按了「只想看」、'play' 按了「加入」、沒給是重新整理或回到房間（照房間裡原本的身分） */
async function joinRoom(c,how){
  if(!db){homeErr='還在連線，請等一下再按';return render();}
  const n=readNick(); if(!n){homeErr='請先輸入暱稱';return render();}
  c=(c||'').trim().toUpperCase(); if(baseMe) me=ls.get('ab_alias_'+c)||baseMe; if(!/^[A-Z0-9]{4}$/.test(c)){homeErr='邀請碼是 4 個英文或數字';return render();}
  const watch=how===true||how==='watch';
  homeErr=''; busy=true; render();
  await act(async()=>{
    const sn=await roomRef(c).get();
    if(!sn.exists||!(sn.data()||{}).ver){if(ls.get('ab_room')===c)ls.del('ab_room');homeErr=`找不到房間 ${c}，請確認邀請碼`;return;}
    if(!roomOK(sn.data().ver)){
      if(ls.get('ab_room')===c)ls.del('ab_room');
      if(verNewer(sn.data().ver,ROOM_VER)){homeErr=`你的遊戲版本比房間舊，更新後再加入一次`;updShown=true;updTick();return;}
      homeErr=`房間 ${c} 是舊版本建立的，請房主重新開房`;return;}
    const d=cleanRoom(sn.data()), cnt=Object.values(d.seats||{}).filter(Boolean).length;
    if(watch&&!(d.seats||{})[me]){
      if(Object.values(d.watchers||{}).filter(Boolean).length>=20){homeErr='觀眾太多了，等一下再來';return;}
      await roomRef(c).update({watchers:{[me]:{name:n,look:lookStr(myLook()),joinedAt:Date.now()}}});
      enterRoom(c);return;
    }
    /* 觀眾和場邊的人：重新整理、回到房間都維持原本的身分（不靠這支手機記的 ab_watch，記錄不見也不會被拉成玩家）；
       只有在大廳按「加入」才改成玩家。遊戲中觀眾看過答案，要等下一局 */
    const w=(d.watchers||{})[me];
    if(w&&!(d.seats||{})[me]&&!watch&&(how!=='play'||w.bench===d.round||d.phase!=='lobby')){
      if(how==='play'&&w.bench!==d.round)toast('這局結束後，在大廳按「我也要玩」就能加入');
      if(!w.bench)ls.set('ab_watch',c);
      enterRoom(c);return;}
    if(!(d.seats||{})[me]){
      /* 房間裡有離線的人：可能就是換了手機或瀏覽器的你（LINE、Safari、主畫面 App 各存一份），問一下要不要接回原本的位子。
         同名但還在線上的不算；沒有在線訊號的舊版手機只問同名的 */
      const now=Date.now(), off=[];
      Object.entries(d.seats||{}).forEach(([id,v])=>{if(!v||id===me)return;if(v.hb?Math.abs(now-v.hb)>=HB_DEAD:v.name===n)off.push([id,v,'離線']);});
      Object.entries(d.watchers||{}).forEach(([id,v])=>{if(v&&id!==me&&d.phase!=='lobby'&&v.bench===d.round&&!(d.seats||{})[id])off.push([id,v,'在場邊']);});
      if(off.length&&!w){
        off.sort((a,b)=>(b[1].name===n)-(a[1].name===n));
        const pid=await pickSeat(off,n);
        if(pid==null)return;
        if(pid){me=pid; ls.set('ab_alias_'+c,me); toast('已接回原本的位子'); enterRoom(c); return;}
      }
      if(cnt>=MAXP){homeErr='這個房間人數已滿';return;}
      /* 房間裡沒有房主（例如最後一個人關掉頁面）：先進來的人直接當房主 */
      const up={seats:{[me]:{name:n,ready:false,joinedAt:Date.now(),look:lookStr(myLook()),hb:Date.now()}}};
      if(w)up.watchers={[me]:null};
      if(!(d.seats||{})[d.host])up.host=me;
      await roomRef(c).update(up);
    } else await roomRef(c).update({seats:{[me]:{look:lookStr(myLook()),hb:Date.now()}}});
    enterRoom(c);
  });
  busy=false; render();
}
/* 每支手機記得自己待過的房間：大家都直接關掉遊戲時沒有人按離開，下次打開時把放了一天沒動靜的房間收掉 */
const ROOM_IDLE=864e5;
function myRooms(){try{const a=JSON.parse(ls.get('ab_rooms')||'[]');return Array.isArray(a)?a:[];}catch(e){return[];}}
function rememberRoom(c,id){const a=myRooms().filter(x=>x.c!==c);a.push({c,id});ls.set('ab_rooms',JSON.stringify(a.slice(-30)));}
function forgetRoom(c){ls.set('ab_rooms',JSON.stringify(myRooms().filter(x=>x.c!==c)));}
async function dropRoom(c,id,hostNow){
  /* 只有房主能刪房間，所以先把房主交給自己 */
  if(!hostNow)await roomRef(c).update({host:id});
  await Promise.all(['chat','guesses','secrets','fx'].map(nm=>wipe(c,nm,()=>true)));
  await roomRef(c).delete();
}
async function sweepRooms(){
  for(const {c,id} of myRooms()){
    if(c===code)continue;
    try{
      const sn=await roomRef(c).get();
      if(!sn.exists){forgetRoom(c);continue;}
      const d=sn.data()||{}, seats=d.seats||{};
      if(!seats[id]){forgetRoom(c);continue;}
      const last=Math.max(d.createdAt||0,...Object.values(seats).map(v=>(v&&v.hb)||0),...Object.values(d.watchers||{}).map(v=>(v&&v.joinedAt)||0));
      if(Date.now()-last<ROOM_IDLE)continue;
      await dropRoom(c,id,d.host===id); forgetRoom(c);
    }catch(e){}
  }
}
function enterRoom(c){
  unsubs.forEach(u=>{try{u();}catch(e){}}); unsubs=[];
  code=c; R=null; roomMissing=false; guesses=[]; secrets=[]; chat=[]; chatLoaded=false; chatStart=Date.now(); joinCode='';
  mySecret=null; input=''; err=''; view=null; scored.clear(); notesKey=null;
  ls.set('ab_room',c); ss.set('ab_live',c); rememberRoom(c,me);
  hbSeen={}; hbLast=0; hostClaim=0; presKey=''; roomSigV=''; roomAt=Date.now();
  unsubs.push(roomRef(c).onSnapshot(snap=>{
    if(!snap.exists||!(snap.data()||{}).ver){roomMissing=true;R=null;return render();}
    const d=snap.data(), sig=roomSig(d), same=!!R&&sig===roomSigV;
    applyRoom(d);
    if(same)return; /* 只有在線訊號變動：不用重畫，也不算遊戲有進度 */
    roomSigV=sig; roomAt=Date.now(); render(); renderChat(); autoScore();
  },()=>{noAccess='連線中斷，請重新整理頁面。';render();}));
  unsubs.push(db.collection(`rooms/${c}/chat`).orderBy('at','desc').limit(30).onSnapshot(snap=>{
    const seen=new Set(chat.map(m=>m.id));
    chat=docsOf(snap,cleanChat).reverse();
    if(chatLoaded) for(const m of chat){ if(!seen.has(m.id)&&m.pid!==me&&m.at>chatStart&&m.at>=((R&&R.chatSince)||0)){ if(!chatOpen){pushPop(m.name||'玩家',m.text);unread++;const b=document.getElementById('chatBadge');if(b){b.hidden=false;b.textContent=unread>9?'9+':unread;}} } }
    chatLoaded=true; renderChat();
  },()=>{}));
  fxLoaded=false; fxSeen=new Set();
  unsubs.push(db.collection(`rooms/${c}/fx`).orderBy('at','desc').limit(12).onSnapshot(snap=>{
    for(const x of docsOf(snap,cleanFx)){if(fxSeen.has(x.id))continue;fxSeen.add(x.id);if(fxLoaded&&x.pid!==me&&x.at>fxStart-2000)playFx(x,false);}
    fxLoaded=true;
  },()=>{}));
  unsubs.push(db.collection(`rooms/${c}/secrets`).onSnapshot(snap=>{secrets=docsOf(snap,cleanSecret);roomAt=Date.now();loadSecret();render();},()=>{}));
  unsubs.push(db.collection(`rooms/${c}/guesses`).onSnapshot(snap=>{guesses=docsOf(snap,cleanGuess);roomAt=Date.now();render();autoScore();},()=>{}));
  clearInterval(pollT); pollT=setInterval(()=>pollOnce(false),3000);
  renderChat(); render();
}
let reviewHTML='', overRound=0, reviewing=false, selfAgain=false;
function applyRoom(d){
  const prev=R&&R.round, prevHost=R&&R.host; R=cleanRoom(d); roomMissing=false; hbTrack();
  for(const id in R.seats){const v=R.seats[id];if(v&&v.name)nameBook[id]=v.name;}
  if(prevHost&&R.host===me&&prevHost!==me) toast('你現在是房主');
  { const bn=Object.keys(R.watchers||{}).filter(id=>(R.watchers[id]||{}).bench===R.round);
    if(prev&&R.phase!=='lobby'){bn.filter(id=>!benchSeen.includes(id)&&id!==me).forEach(id=>toast(`${nameOf(id)} 先到場邊`));benchSeen.filter(id=>!bn.includes(id)&&id!==me&&isSeated(id)).forEach(id=>toast(`${nameOf(id)} 回來了`));}
    benchSeen=bn; }
  seatGuard();
  if(prev&&R.round!==prev){ arenaOpen=false; if(overRound===prev&&!selfAgain&&reviewHTML) reviewing=true; selfAgain=false; overRound=0;input='';err='';view=null;scored.clear();mySecret=null;}
  loadSecret();
}
/* 備援：即時連線慢時，主動抓最新資料 */
let pollT=null, polling=false;
async function pollOnce(force){
  if(!code||!db||polling||document.hidden)return;
  const st=R?derive().status:'lobby';
  if(!force&&R&&R.phase==='coop')return;
  if(!force&&!['lobby','secret','loading','countdown'].includes(st))return;
  polling=true; const c=code;
  try{
    const jobs=[roomRef(c).get(),db.collection(`rooms/${c}/secrets`).get()];
    if(force||st==='playing') jobs.push(db.collection(`rooms/${c}/guesses`).get());
    const [rs,ss,gs]=await Promise.all(jobs);
    if(c!==code)return;
    if(rs.exists) applyRoom(rs.data());
    secrets=docsOf(ss,cleanSecret);
    if(gs) guesses=docsOf(gs,cleanGuess);
    loadSecret(); render(); autoScore();
  }catch(e){}
  finally{polling=false;}
}

let updShown=false;
const roomOK=v=>!!v&&!verNewer(v,ROOM_VER)&&!verNewer(ROOM_MIN,v);
const verNum=v=>String(v||'').split(/[.-]/).map(Number);
function verNewer(a,b){const A=verNum(a),B=verNum(b);for(let i=0;i<Math.max(A.length,B.length);i++){const d=(A[i]||0)-(B[i]||0);if(d)return d>0;}return false;}
let updTag='';
async function checkUpdate(){
  if(updShown||location.protocol==='file:')return;
  try{const u=location.pathname+'?_='+Date.now();
    /* 先只問檔案有沒有變，沒變就不用下載整頁 */
    const h=await fetch(u,{method:'HEAD',cache:'no-store'}),tag=h.headers.get('etag')||h.headers.get('last-modified')||'';
    if(tag&&tag===updTag)return;updTag=tag;
    const r=await fetch(u,{cache:'no-store'});const t=await r.text();
    const m=t.match(/const APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION){updShown=true;updTick();}}catch(e){}
}

/* ---------- 誰還在線 ----------
   seats[me].hb：每 25 秒更新一次的數字。只看「有沒有變動」，不比較不同手機的時鐘。
   舊版手機不會寫 hb，所以沒有 hb 的人一律當「不知道」，不會自動判定他離線。 */
const HB_GAP=25000, HB_DEAD=80000, HB_STALE=600000;
let hbSeen={}, hbLast=0, hbBusy=false, hostClaim=0, roomSigV='', roomAt=0, presKey='', netBad=false, leaving=false;
const roomSig=d=>JSON.stringify(d,(k,v)=>k==='hb'?undefined:v);
function hbTrack(){const S=(R&&R.seats)||{},now=Date.now();
  for(const id in S){const v=S[id]&&S[id].hb;if(v==null)continue;const o=hbSeen[id];
    if(!o)hbSeen[id]={v,t:now-v>HB_STALE?now-HB_DEAD-1:now};else if(o.v!==v)hbSeen[id]={v,t:now};}}
const isGone=id=>{if(!id||id===me)return false;const v=((R&&R.seats)||{})[id];if(!v||v.hb==null)return false;const o=hbSeen[id];return !!o&&Date.now()-o.t>HB_DEAD;};
const noBeat=id=>{const v=((R&&R.seats)||{})[id];return !!v&&v.hb==null&&id!==me;};
const stalled=()=>!!roomAt&&Date.now()-roomAt>90000;
const unseen=id=>isGone(id)||(noBeat(id)&&stalled());
async function hbBeat(force){
  if(!code||!db||!R||roomMissing||hbBusy||leaving||!isSeated(me))return;
  const now=Date.now();if(!force&&now-hbLast<HB_GAP-2000)return;
  hbLast=now;hbBusy=true;const c=code,slow=setTimeout(()=>{netBad=true;netUI();},12000);
  try{await roomRef(c).update({seats:{[me]:{hb:now}}});}catch(e){}
  finally{clearTimeout(slow);hbBusy=false;if(netBad){netBad=false;netUI();pollOnce(true);}}
}
/* 要離開座位時先停掉在線訊號、等送到一半的那筆結束，不然它會在座位清掉後才到，留下沒有名字的座位 */
const hbStop=async()=>{leaving=true;for(let i=0;i<30&&hbBusy;i++)await new Promise(r=>setTimeout(r,100));};
/* 房主不見了：線上最早進房的人自動接手（大家算出來的是同一個人）。舊版手機不會接手，所以只算有在線訊號的人 */
function hostCheck(){
  const s=g();if(!R||!isSeated(me)||s.host===me)return;
  if((s.seats||{})[s.host]&&!isGone(s.host))return;
  const next=players().find(p=>p.hb!=null&&!isGone(p.id));
  if(!next||next.id!==me||Date.now()-hostClaim<8000)return;

/* 最後一個位子同時被兩人搶：大家排好順序，排在 8 個以外的人自己退出 */
function seatGuard(){
  if(leaving||!R||R.phase!=='lobby'||!isSeated(me))return;const L=players();if(L.length<=MAXP||L.findIndex(p=>p.id===me)<MAXP)return;
  leaving=true;setTimeout(async()=>{await hbStop();try{await roomRef().update({seats:{[me]:null}});}catch(e){}goHome();homeErr='這個房間人數已滿';render();},0);

/* 不等他：人先到場邊（觀眾名單裡標 bench），這局看不到答案，隨時能回來；其他人的流程和他離開一樣，舊版手機也看得懂 */
const benchOf=id=>{const s=g(),w=(s.watchers||{})[id];return !!w&&w.bench===s.round;};
function benchUp(ids){const s=g(),seats={},watchers={};ids.forEach(id=>{const v=s.seats[id];if(!v)return;seats[id]=null;watchers[id]={name:v.name,look:v.look,joinedAt:v.joinedAt||Date.now(),bench:s.round};});return{seats,watchers};}

function waitIds(){const s=g(),D=derive();

/* 大廳裡從玩家改成觀眾：不用離開再進來；房主改觀戰就把房主交給下一位 */
async function becomeWatcher(){
  const s=g(); if(!isSeated(me)||s.phase!=='lobby')return;
  if(Object.values(s.watchers||{}).filter(Boolean).length>=20){toast('觀眾已滿 20 人');return;}
  const rest=players().filter(p=>p.id!==me&&!isGone(p.id));
  if(s.host===me&&!rest.length){toast('房間只有你一個人，先邀請朋友再改觀戰');return;}
  const v=s.seats[me]||{}, upd={seats:{[me]:null},watchers:{[me]:{name:v.name||nameOf(me),look:v.look||lookStr(myLook()),joinedAt:Date.now()}}};
  if(s.host===me) upd.host=rest[0].id;
  await hbStop(); ls.set('ab_watch',code);
  try{await act(()=>roomRef().update(upd));}finally{leaving=false;}
}
async function leaveRoom(){
  if(isWatcher(me)){ls.del('ab_watch');try{await roomRef().update({watchers:{[me]:null}});}catch(e){} goHome();return;}
  if(gameBusy()&&!confirmTap('leave','確定離開這局？再按一次'))return;
  await hbStop();
  const s=g(); const rest=players().filter(p=>p.id!==me&&!isGone(p.id));
  /* 最後一個人離開就把房間收掉，不留沒有房主的空房間 */
  forgetRoom(code);
  if(!rest.length){const c=code;try{await dropRoom(c,me,s.host===me);}catch(e){try{await roomRef(c).update({seats:{[me]:null}});}catch(e2){}}goHome();return;}
  const upd={seats:{[me]:null}}; if(s.host===me) upd.host=rest[0].id;
  try{await roomRef().update(upd);}catch(e){}
  goHome();
}

function derange(ids){
  if(ids.length<2)return{};
  let p;
  do{p=ids.slice();for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]];}}while(p.some((x,i)=>x===ids[i]));
  const m={};ids.forEach((id,i)=>m[id]=p[i]);return m;
}
let acking=0, starting=0, tickT=null, reassigning=0;
async function syncStep(D){
  const s=g(); if(!code||!R)return;
  /* 還沒出題就離開的人，他的題目永遠等不到：房主重新分配，人不夠就回大廳 */
  if(D.status==='secret'&&isHost()&&D.parts.some(id=>!s.seats[id]&&!hasSecret(id))&&Date.now()-reassigning>3000){
    reassigning=Date.now();const keep=D.parts.filter(id=>s.seats[id]);
    try{if(keep.length<2){await backToLobby(true);toast('人不夠了，先回到大廳');}else await roomRef().update({assign:JSON.stringify(derange(keep))});}catch(e){reassigning=0;}
  }
  if(D.status==='loading'&&me in D.A&&secretOf(D.A[me])!=null&&((s.seats[me]||{}).ack!==s.round)&&Date.now()-acking>3000){
    acking=Date.now();
    try{await roomRef().update({seats:{[me]:{ack:s.round}}});}catch(e){acking=0;}
  }
  if(D.status==='loading'&&!s.startAt&&D.parts.length&&D.parts.every(id=>D.acked.includes(id)||D.out[id])&&Date.now()-starting>3000){
    starting=Date.now();
    try{await roomRef().update({startAt:Date.now()+3500});}catch(e){starting=0;}
  }
  clearTimeout(tickT);
  if(D.status==='loading') tickT=setTimeout(()=>{if(derive().status==='loading')render();},3200);
  if(D.status==='countdown'){const ms=(s.startAt-Date.now())%1000;tickT=setTimeout(render,(ms>0?ms:1000)+30);}
}

}

const pxCells=M=>[...M].map(([k,c])=>{const i=k.indexOf(',');return{x:+k.slice(0,i),y:+k.slice(i+1),c};});
function pxBox(M){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const k of M.keys()){const i=k.indexOf(','),x=+k.slice(0,i),y=+k.slice(i+1);if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}return{x0:a,y0:b,x1:c,y1:d};}
function pxOutline(M){const O=new Map();for(const k of M.keys()){const i=k.indexOf(','),x=+k.slice(0,i),y=+k.slice(i+1);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const q=(x+dx)+','+(y+dy);if(!M.has(q))O.set(q,PXO);});}return O;}

function scene(ws,ls,line,label,opt){ opt=opt||{};

  bx=ws.length?W/2-bw/2:bx; bx=Math.max(4,Math.min(bx,W-bw-4));
  const tx=opt._tx!=null?Math.max(bx+14,Math.min(bx+bw-14,opt._tx)):bx+10;
  /* 字用固定寬度塞進白框（字型還沒載入也不會超出）；只有一個贏家時，泡泡跟著他閃躲移動 */

}
function podium(D){

async function autoScore(){
  const s=g(); if(!mySecret||mySecret.round!==s.round) return;
  for(const x of guesses){
    if(x.round===s.round&&x.target===me&&!x.hint&&x.A==null&&!scored.has(x.id)){
      scored.add(x.id); const r=score(mySecret.s,x.g);
      try{await db.collection(`rooms/${code}/guesses`).doc(x.id).update({A:r.A,B:r.B});}catch(e){scored.delete(x.id);}
    }
  }
}

  err='';
  if(k==='del'){let t=input;while(t.length&&locks[t.length-1])t=t.slice(0,-1);input=t.slice(0,-1);fillLocks();}
  else if(k==='ok') return submit();
  else if(input.length<g().len){ if(!g().rep&&(input.includes(k)||locks.includes(k))) err='數字不能重複'; else {input+=k;fillLocks();} }
  render();
}

    S.changeAt = (k) => { const s = k % S.per; return s === 0 || (s === S.per / 2 && S.ch[Math.floor(k / S.per) % S.ch.length].length > 1); };

      'F#5 - - - E5 - D5 - | C#5 - E5 - A5 - - - | B5 - - - A5 - F#5 - | E5 - - - - - . . |' +
      'D6 - - - C#6 - B5 - | A5 - - - . . E5 - | F#5 - G5 - A5 - B5 - | A5 - - - F#5 - - - |' +
      'G5 - - - F#5 - E5 - | E5 - - - D5 - C#5 - | D5 - - - - - . . | . . A4 - B4 - C#5 -',
    chords: 'Dmaj7|Bm7|Gmaj7|Asus4 A|Dmaj7|F#m7|Gmaj7|Asus4 A|Bm7|F#m7|Gmaj7|D/F#|Em7|A7|Dmaj7|A',
    /* 空間：回音是附點八分音符（0.75 拍）、回授 0.5、2200Hz 以上慢慢變暗；殘響回授 0.9（很大的空間） */

['click','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>BGM.unlock(),{capture:true,passive:true}));
document.addEventListener('change',e=>{const x=e.target;if(!x||!x.matches||!x.matches('input[data-sfx]'))return;const on=x.checked;ls.set('ab_sfx',on?'1':'0');
  document.querySelectorAll('input[data-sfx]').forEach(y=>{y.checked=on;});if(on){ChipAudio.unlock();sfx('throw');}
  toast(on?'音效開了：只有丟的人和被丟的人聽得到':'音效關了');});
document.addEventListener('visibilitychange',bgmSync);
addEventListener('pagehide',()=>{BGM.stop();ChipAudio.hush();});   /* 關掉、滑掉主畫面 App：先把聲音收掉，不會破音 */
setInterval(bgmSync,2000);
/* 400KB 的像素字型只用在角色名字和對話框：等畫面出來才在背景下載，省流量模式不下載，沒下載時用內建字體 */
function loadPixelFont(){try{const c=navigator.connection;if(c&&(c.saveData||/2g/.test(c.effectiveType||'')))return;const f=new FontFace('Cubic11','url(Cubic_11.woff2)',{display:'swap'});document.fonts.add(f);f.load().catch(()=>{});}catch(e){}}
addEventListener('load',()=>setTimeout(()=>{(window.requestIdleCallback||(fn=>fn()))(loadPixelFont,{timeout:4000});},1800));
</script>
