/* iPhone 上下邊，和排球記錄表同一套做法（都在 iPhone 實機確認過）。主畫面 App 有兩種狀況：
   一、從狀態列後面開始畫（上 inset 大於 0）：系統蓋的模糊關不掉，內容要多留 40，模糊才只落在色帶上；開機時 100dvh 會少一截，要用 100lvh 才到螢幕底。
   二、從狀態列下方開始（上 inset 0）：沒有模糊，100lvh 不準，要用 100dvh。下面的 min() 兩種都對。不用 black-translucent。 */
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);--vgap:0px;--brand:#1d3a6b;--edge:repeating-linear-gradient(90deg,#d9503e 0 8px,transparent 8px 12px,#f2b544 12px 20px,transparent 20px 24px);color-scheme:light}
.statusband{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--brand);z-index:99;pointer-events:none;overflow:hidden}
.footband{display:none}
html{touch-action:manipulation;overscroll-behavior:none}
body{margin:0;box-sizing:border-box;min-height:100vh;min-height:100dvh;padding-top:var(--safe-top);padding-bottom:var(--safe-bot);overscroll-behavior:none;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei UI","Microsoft JhengHei",system-ui,sans-serif;-webkit-text-size-adjust:100%}
@media (display-mode:standalone){
  :root{--safe-top:calc(env(safe-area-inset-top,0px) + min(40px,calc(env(safe-area-inset-top,0px)*99)));color-scheme:dark}
  html{background:var(--brand)}
  body{color-scheme:var(--cs,light)}
  .statusband{height:max(6px,var(--safe-top))}
  .statusband::after,.footband::before{content:"";position:absolute;left:0;right:0;height:4px;background:var(--edge)}
  .statusband::after{bottom:0}
  .footband::before{top:0}
}
@media (display-mode:standalone) and (orientation:portrait){
  .footband{display:block;position:fixed;left:0;right:0;bottom:calc(0px - var(--vgap));height:var(--safe-bot);background:var(--brand);z-index:99;pointer-events:none;overflow:hidden}
}
@media (display-mode:standalone) and (orientation:landscape) and (max-height:500px){.statusband{display:none}}
@supports (height:100lvh){
  @media (display-mode:standalone){
    :root{--app-h:min(100lvh,calc(100dvh + env(safe-area-inset-top,0px)*99));--vgap:calc(var(--app-h) - 100dvh)}
    html,body{min-height:var(--app-h)}
    .drawer,.nback,.upd,.fxl,.ghostov{bottom:calc(0px - var(--vgap))!important}
  }
}
img{max-width:100%}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent}

<script>

function score(secret,guess){
  let A=0;const cs={},cg={};
  for(let i=0;i<secret.length;i++){if(secret[i]===guess[i])A++;cs[secret[i]]=(cs[secret[i]]||0)+1;cg[guess[i]]=(cg[guess[i]]||0)+1;}
  let c=0;for(const d in cg)c+=Math.min(cg[d],cs[d]||0);return{A,B:c-A};
}
function hk(pid){let h=0;for(const ch of String(pid))h=(h*31+ch.charCodeAt(0))%9973;return h;}
function enc(s,r,pid){const k=r*7+hk(pid)*3;return btoa(s.split('').map((d,i)=>String.fromCharCode(65+((+d+k+i*5)%10)+10*((i*7+r)%2))).join('')).split('').reverse().join('');}
function dec(c,r,pid){const k=r*7+hk(pid)*3;try{return atob(c.split('').reverse().join('')).split('').map((ch,i)=>{const v=(ch.charCodeAt(0)-65)%10;return String(((v-(k+i*5))%10+1000000)%10);}).join('');}catch(e){return null;}}

/* 資料庫讀回來的東西一律當成外來資料：數字轉成數字、代號和顏色只收認得的格式，畫面和邏輯都只用清過的資料。
   只在讀取時處理，寫進資料庫的格式完全不變，新舊版手機可以同房。 */
const num=(v,d=0)=>{const n=typeof v==='number'?v:(typeof v==='string'&&v.trim()!=='')?Number(v):NaN;return Number.isFinite(n)?n:d;};
const txt=(v,n=300)=>typeof v==='string'?v.slice(0,n):typeof v==='number'?String(v):'';
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const isMap=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const usage=v=>isMap(v)?{r:num(v.r),n:num(v.n)}:undefined;
function cleanSeat(v){if(!isMap(v)||!txt(v.name,16))return null;const o={...v,name:txt(v.name,16),ready:!!v.ready,joinedAt:num(v.joinedAt),look:txt(v.look,40)};
  for(const k of ['ack','gaveUp','hb'])if(o[k]!=null)o[k]=num(o[k]);
  for(const k of ['an','gh'])if(o[k]!=null)o[k]=usage(o[k]);
  return o;}
const cleanSeats=m=>{const o={};if(isMap(m))for(const id in m)o[id]=cleanSeat(m[id]);return o;};
function cleanVil(v){if(!isMap(v))return undefined;return{...v,n:txt(v.n,12),p:v.p==='dino'||own(PX_VIL,v.p)?v.p:'',c:/^#[0-9a-f]{6}$/i.test(v.c)?v.c:'#9aa3b5',all:Array.isArray(v.all)?v.all.map(x=>txt(x,60)):undefined,says:txt(v.says,60),back:txt(v.back,60),says2:txt(v.says2,60),stage:txt(v.stage,24)};}
function cleanCoop(c){if(!isMap(c))return null;const o={...c,order:Array.isArray(c.order)?c.order.map(x=>txt(x,64)):[],startAt:num(c.startAt),bossC:txt(c.bossC,40),team:txt(c.team,8).replace(/\D/g,''),surrender:!!c.surrender,vil:cleanVil(c.vil)};
  if(c.turnSec!=null)o.turnSec=num(c.turnSec);if(c.an!=null)o.an=usage(c.an);
  const n=c.notes;o.notes=isMap(n)?{d:Array.isArray(n.d)?n.d.map(x=>x===1||x===2?x:0):undefined,pos:Array.isArray(n.pos)?n.pos.map(x=>/^\d$/.test(String(x??''))?String(x):''):[],memo:txt(n.memo),auto:Array.isArray(n.auto)?n.auto.filter(x=>typeof x==='number'):[]}:null;
  return o;}
function cleanRoom(d){d=isMap(d)?d:{};const L=num(d.len),o={...d};
  for(const [k,n] of [['ver',24],['host',64],['code',8],['assign',3000],['phase',12],['mode',12],['diff',8],['stage',24]])o[k]=txt(d[k],n);
  o.round=Math.max(1,Math.floor(num(d.round,1)));o.len=L===3||L===5?L:4;o.rep=!!d.rep;o.finish=!!d.finish;o.startAt=num(d.startAt);o.chatSince=num(d.chatSince);

  o.coop=cleanCoop(d.coop);return o;}
function cleanGuess(x){if(!/^\d{1,8}$/.test(String(x.g??'')))return null;
  const o={...x,g:String(x.g),round:num(x.round),n:num(x.n),at:num(x.at),pid:txt(x.pid,64),target:txt(x.target,64),kind:txt(x.kind,8),think:txt(x.think,400),hint:!!x.hint,A:x.A==null?null:num(x.A),B:x.B==null?null:num(x.B)};
  if(x.pos!=null)o.pos=num(x.pos);return o;}
const cleanSecret=x=>({...x,round:num(x.round),pid:txt(x.pid,64),c:txt(x.c,40)});
const cleanChat=x=>({...x,pid:txt(x.pid,64),name:txt(x.name,16),text:txt(x.text,60),at:num(x.at)});
function cleanFx(x){const it=txt(x.item,10);if(it!=='ghost'&&it!=='angel'&&!own(PX_ITEM,it))return null;
  return{...x,item:it,pid:txt(x.pid,64),name:txt(x.name,16),target:txt(x.target,70),n:Math.min(20,Math.max(1,Math.floor(num(x.n,1)))),res:txt(x.res,20),text:txt(x.text,300),at:num(x.at)};}
const docsOf=(snap,fn)=>snap.docs.map(x=>fn({id:x.id,...x.data()})).filter(Boolean);

const g=()=>solo||R||{};
function assignMap(){try{return JSON.parse(g().assign||'{}')||{};}catch(e){return{};}}
function players(){const S=g().seats||{};return Object.entries(S).filter(([id,v])=>v&&typeof v==='object').map(([id,v])=>({id,...v})).sort((a,b)=>((a.joinedAt||0)-(b.joinedAt||0))||(a.id<b.id?-1:1));}
const isSeated=id=>!!(id&&g().seats&&g().seats[id]);
const nameBook={}; /* 離開的人座位會清空，名字留一份，畫面才不會變成「玩家」 */
const nameOf=id=>(g().seats&&g().seats[id]&&g().seats[id].name)||(g().watchers&&g().watchers[id]&&g().watchers[id].name)||nameBook[id]||'玩家';
const isWatcher=id=>!!(id&&!isSeated(id)&&g().watchers&&g().watchers[id]);
const watchersList=()=>Object.entries(g().watchers||{}).filter(([id,v])=>v&&typeof v==='object').map(([id,v])=>({id,...v}));
const isHost=()=>g().host===me;
function secretOf(pid){const s=g();const d=secrets.find(x=>x.round===s.round&&x.pid===pid);return d?dec(d.c,d.round,d.pid):null;}
const hasSecret=pid=>secrets.some(x=>x.round===g().round&&x.pid===pid);

function derive(){
  const s=g(), P=players(), A=assignMap(), parts=Object.keys(A), seats=s.seats||{};
  const rg=guesses.filter(x=>x.round===s.round);
  const hc=s.hintCost==null?2:s.hintCost, aN=angelMax(), ac=s.angelCost==null?1:s.angelCost, angels={}, turn={}, cnt={}, by={}, solved={}, solvedAt={}, pend={}, best={}, hints={}, out={};
  parts.forEach(id=>{
    const L=rg.filter(x=>x.pid===id).sort((a,b)=>a.n-b.n); by[id]=L;
    const i=L.findIndex(x=>!x.hint&&x.A===s.len); turn[id]=i<0?0:i+1; solvedAt[id]=i<0?0:L[i].at||0;
    const wt=x=>x.hint?hc:1, an=(seats[id]||{}).an; angels[id]=an&&an.r===s.round?an.n||0:0;
    cnt[id]=L.reduce((t,x)=>t+wt(x),0)+angels[id]*ac; solved[id]=i<0?0:L.slice(0,i+1).reduce((t,x)=>t+wt(x),0)+angels[id]*ac;
    pend[id]=L.find(x=>!x.hint&&x.A==null)||null;
    best[id]=L.filter(x=>!x.hint&&x.A!=null).reduce((b,x)=>(!b||x.A*10+x.B>b.A*10+b.B)?x:b,null);
    hints[id]=L.filter(x=>x.hint).length;
    out[id]=!seats[id]?'left':(seats[id].gaveUp===s.round?'gave':'');
  });
  const live=parts.filter(id=>!out[id]&&!turn[id]);
  const S=parts.filter(id=>turn[id]).reduce((m,id)=>Math.min(m,turn[id]),Infinity);
  const minN=live.length?Math.min(...live.map(id=>by[id].length)):0;
  const allIn=parts.length>0&&parts.every(hasSecret);
  let status;
  if(s.phase!=='secret'&&s.phase!=='playing') status='lobby';
  else if(!allIn) status='secret';
  else if(!parts.every(id=>(seats[id]||{}).ack===s.round||out[id])||!s.startAt) status='loading';
  else if(Date.now()<s.startAt&&s.startAt-Date.now()<8000) status='countdown';
  else if(live.length===0||(!s.finish&&S<Infinity&&live.every(id=>by[id].length>=S))) status='over';
  else status='playing';
  let rank=[];
  if(parts.length){
    rank=parts.map(id=>({id,c:solved[id],n:cnt[id],h:hints[id],a:angels[id],out:out[id],best:best[id]}));
    const bv=r=>r.best?r.best.A*10+r.best.B:-1;

function autoMarkFrom(L,len){

    if(x.hint||x.A==null||notes.auto.includes(x.n))continue;

    const ds=[...new Set(String(x.g).split(''))];
    if(x.A+x.B===0) ds.forEach(d=>{if(notes.d[+d]!==2){notes.d[+d]=2;no.add(d);}});
    else if(x.A+x.B===len){ds.forEach(d=>{if(notes.d[+d]!==1){notes.d[+d]=1;yes.add(d);}});for(let d=0;d<10;d++)if(!ds.includes(String(d))&&notes.d[d]!==2){notes.d[d]=2;no.add(String(d));}}
  }

  saveNotes(); renderNotes();
  const msg=[]; if(yes.size)msg.push(`標出 ${[...yes].sort().join('、')}`); if(no.size)msg.push(`劃掉 ${[...no].sort().join('、')}`);

}

async function act(fn){

  catch(e){noAccess=navigator.onLine===false?'目前沒有網路，連上後再試一次。':`連線出了問題，請稍後再試一次。（代碼：${(e&&(e.code||e.message))||'unknown'}）`;}

const roomRef=c=>db.doc('rooms/'+(c||code));
function readNick(){const v=(document.getElementById('nick')?.value||'').trim();if(v){nick=v;ls.set('ab_nick',v);}return nick;}
function newCode(){let s='';for(let i=0;i<4;i++)s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return s;}
async function createRoom(){
  if(!db)return;

  homeErr=''; busy=true; render();

async function joinRoom(c,watch){
  if(!db){homeErr='還在連線，請等一下再按';return render();}
  const n=readNick(); if(!n){homeErr='請先輸入暱稱';return render();}
  c=(c||'').trim().toUpperCase(); if(baseMe) me=ls.get('ab_alias_'+c)||baseMe; if(!/^[A-Z0-9]{4}$/.test(c)){homeErr='邀請碼是 4 個英文或數字';return render();}
  homeErr=''; busy=true; render();
  await act(async()=>{
    const sn=await roomRef(c).get();
    if(!sn.exists||!(sn.data()||{}).ver){if(ls.get('ab_room')===c)ls.del('ab_room');homeErr=`找不到房間 ${c}，請確認邀請碼`;return;}
    if(!roomOK(sn.data().ver)){
      if(ls.get('ab_room')===c)ls.del('ab_room');
      if(verNewer(sn.data().ver,ROOM_VER)){homeErr=`你的遊戲版本比房間舊，更新後再加入一次`;updShown=true;updTick();return;}
      homeErr=`房間 ${c} 是舊版本建立的，請房主重新開房`;return;}
    const d=cleanRoom(sn.data()), cnt=Object.values(d.seats||{}).filter(Boolean).length;
    if(watch&&!(d.seats||{})[me]){
      if(Object.values(d.watchers||{}).filter(Boolean).length>=20){homeErr='觀眾太多了，等一下再來';return;}
      await roomRef(c).update({watchers:{[me]:{name:n,look:lookStr(myLook()),joinedAt:Date.now()}}});
      enterRoom(c);return;
    }
    if((d.watchers||{})[me]&&!(d.seats||{})[me]&&!watch&&ls.get('ab_watch')===c){enterRoom(c);return;}
    if(!(d.seats||{})[me]){
      const same=Object.entries(d.seats||{}).filter(([id,v])=>v&&v.name===n&&id!==me);
      /* 同名的人還在線上就不是「斷線的你」，不能接手他的位子；沒有在線訊號的舊版手機維持原本的詢問 */
      const taken=same.some(([id,v])=>v.hb&&Math.abs(Date.now()-v.hb)<HB_DEAD);
      if(same.length===1&&!taken&&confirm(`房間裡已經有「${n}」，是你剛剛斷線或重新整理嗎？\n\n按「確定」接回原本的位子（題目和猜過的紀錄都會保留）\n按「取消」用新的身分加入`)){
        me=same[0][0]; ls.set('ab_alias_'+c,me); toast('已接回原本的位子'); enterRoom(c); return;}
      if(cnt>=MAXP){homeErr='這個房間人數已滿';return;}
      /* 房間裡沒有房主（例如最後一個人關掉頁面）：先進來的人直接當房主 */
      const up={seats:{[me]:{name:n,ready:false,joinedAt:Date.now(),look:lookStr(myLook()),hb:Date.now()}}};
      if(!(d.seats||{})[d.host])up.host=me;
      await roomRef(c).update(up);
    } else await roomRef(c).update({seats:{[me]:{look:lookStr(myLook()),hb:Date.now()}}});
    enterRoom(c);
  });
  busy=false; render();
}
function enterRoom(c){
  unsubs.forEach(u=>{try{u();}catch(e){}}); unsubs=[];
  code=c; R=null; roomMissing=false; guesses=[]; secrets=[]; chat=[]; chatLoaded=false; chatStart=Date.now();

  ls.set('ab_room',c); ss.set('ab_live',c);
  hbSeen={}; hbLast=0; hostClaim=0; presKey=''; roomSigV=''; roomAt=Date.now();
  unsubs.push(roomRef(c).onSnapshot(snap=>{
    if(!snap.exists||!(snap.data()||{}).ver){roomMissing=true;R=null;return render();}
    const d=snap.data(), sig=roomSig(d), same=!!R&&sig===roomSigV;
    applyRoom(d);
    if(same)return; /* 只有在線訊號變動：不用重畫，也不算遊戲有進度 */
    roomSigV=sig; roomAt=Date.now(); render(); renderChat(); autoScore();
  },()=>{noAccess='連線中斷，請重新整理頁面。';render();}));
  unsubs.push(db.collection(`rooms/${c}/chat`).orderBy('at','desc').limit(30).onSnapshot(snap=>{
    const seen=new Set(chat.map(m=>m.id));
    chat=docsOf(snap,cleanChat).reverse();
    if(chatLoaded) for(const m of chat){ if(!seen.has(m.id)&&m.pid!==me&&m.at>chatStart&&m.at>=((R&&R.chatSince)||0)){ if(!chatOpen){pushPop(m.name||'玩家',m.text);unread++;const b=document.getElementById('chatBadge');if(b){b.hidden=false;b.textContent=unread>9?'9+':unread;}} } }
    chatLoaded=true; renderChat();
  },()=>{}));
  fxLoaded=false; fxSeen=new Set();
  unsubs.push(db.collection(`rooms/${c}/fx`).orderBy('at','desc').limit(12).onSnapshot(snap=>{
    for(const x of docsOf(snap,cleanFx)){if(fxSeen.has(x.id))continue;fxSeen.add(x.id);if(fxLoaded&&x.pid!==me&&x.at>fxStart-2000)playFx(x,false);}
    fxLoaded=true;
  },()=>{}));

  unsubs.push(db.collection(`rooms/${c}/guesses`).onSnapshot(snap=>{guesses=docsOf(snap,cleanGuess);roomAt=Date.now();render();autoScore();},()=>{}));
  clearInterval(pollT); pollT=setInterval(()=>pollOnce(false),3000);

function pxBuild(o){o=o||{};
  if(o.prop==='dino'){const M=pxPut(new Map(),PX_DINO,PX_DPAL);const F={};for(const k in PX_DFACE)F[k]=pxPut(new Map(),PX_DFACE[k],{K:'#1e1b2e'});
    if(o.gave)pxPut(M,PX_PART.flag[1],PX_PPAL('#000'),PX_PART.flag[2]+1,PX_PART.flag[0]+4);
    return{M,F,cx:9,hd:[2,2,15,12],face:o.boss?'boss':'normal'};}
  const lk=o.look, v=PX_VIL[o.prop]||null;
  const skin=lk?LOOK.skin[lk.skin]:'#f7cba2', shirt=lk?LOOK.shirt[lk.shirt]:(o.color||'#9aa3b5');
  const hc=v?v.hc:lk?LOOK.hc[lk.hc]:'#2b2b33', pal=PX_PPAL(hc,shirt);
  const M=pxPut(new Map(),PX_BODY,{S:skin,s:shadeC(skin,-.16),O:shirt,o:shadeC(shirt,-.22),P:'#4b5a8e',D:'#6b3e2a'});
  const hair=v?v.hair:lk?LOOK.hair[lk.hair][0]:'short';
  const H=PX_HAIR[hair]; if(H)pxPut(M,H[1],Object.assign({},pal,{L:shadeC(skin,.45)}),H[2]||0,H[0]);
  const parts=v?v.parts.slice():[]; if(o.boss&&!(v&&v.notie))parts.unshift('tie');
  if(lk){const a=LOOK.acc[lk.acc][0];if(a!=='none')parts.push(a);const bd=LOOK.beard[lk.beard||0][0];if(bd!=='none')parts.push(bd);}
  if(o.gave)parts.push('flag');
  parts.forEach(p=>{const d=PX_PART[p];if(d)pxPut(M,d[1],Object.assign({},pal,p==='suit'||p==='vest'||p==='coat'?{S:skin}:{}),d[2]||0,d[0]);});
  if(o.crown){let top=99;for(const k of M.keys()){const [x,y]=k.split(',').map(Number);if(x>=3&&x<=12&&y<top)top=y;}pxPut(M,PX_CROWN,{B:'#3fa0ff',R:'#e8364a',Y:'#ffd23f',y:'#d18f12'},0,top-5);}

}

function pxStand(x,feetY,o,px){px=px||PXS;const b=pxBuild(o),bx=pxBox(b.M),x0=x-b.cx*px,y0=feetY-(bx.y1+1)*px;
  const T=`transform="translate(${x0} ${y0}) scale(${px})"`;
  const O=pxOutline(b.M),cut=bx.y1-2,sp=(A,lo)=>{const R=new Map();A.forEach((c,k)=>{if((+k.split(',')[1]>=cut)===lo)R.set(k,c);});return R;};
  const legs=`<g ${T} shape-rendering="crispEdges">${pxPaths(sp(O,true))}${pxPaths(sp(b.M,true))}</g>`;
  const body=`<g ${T} shape-rendering="crispEdges">${pxPaths(sp(O,false))}${pxPaths(sp(b.M,false))}</g>`;
  const fn=`<g class="fn" ${T} shape-rendering="crispEdges">${pxPaths(b.F[b.face]||b.F.normal)}</g>`+(b.face==='C'?`<text class="fn" x="${x+30}" y="${y0+7*px}" font-size="13" fill="#ffd34d" stroke="#1e1b2e" stroke-width="3" paint-order="stroke" font-family="Cubic11,sans-serif">哈哈</text>`:'');
  const fh=`<g class="fh" ${T} shape-rendering="crispEdges">${pxPaths(b.F.hurt)}</g>`;
  const [a,c,d,e]=b.hd, hd=`<rect class="hd" x="${x0+a*px}" y="${y0+c*px}" width="${(d-a)*px}" height="${(e-c)*px}" fill="none"/>`;
  const dl=((Math.round(x*7+feetY*3)%11)/11*1.4).toFixed(2);
  const bz=`class="brz" style="--p:${px}px;animation-delay:-${dl}s"`;
  return{svg:legs+`<g ${bz}>${body+fn+fh}</g>`+hd,top:y0+bx.y0*px,bz};
}

function scene(ws,ls,line,label,opt){ opt=opt||{};
  const W=360, ground=246, per=4, layers=[];

  if(!layers.length) layers.push([]);
  let gs='', idx=0;
  layers.forEach((row,k)=>{
    const y=ground-14-k*22, step=Math.min(86,(W-30)/Math.max(1,row.length));
    const x0=W/2-step*(row.length-1)/2-(row.length>1?14*(k%2?-1:1):0);
    row.forEach((p,j)=>{gs+=svgLying(x0+j*step+(k%2?-14:14),y,p.name,p.color,k%2===1,idx++,p.gave,p.prop,p.look,p.who);});
  });
  const layerTop=ground-14-(layers.length-1)*22-2;
  let w='', topY, bx, by;
  if(ws.length){
    const wstep=Math.min(90,(W-80)/ws.length), wx0=W/2-wstep*(ws.length-1)/2;
    ws.forEach((p,i)=>{w+=svgWinner(wx0+i*wstep,layerTop,p.name,p.color,i,p.boss,p.prop,p.look,p.who,p.tg);});
    topY=layerTop-128-54; bx=W/2-60; by=topY+2; opt._tx=wx0;
  } else { topY=layerTop-56; bx=W/2-50; by=topY+4; }
  const bw=Math.min(W-8,[...line].length*13+20);
  bx=ws.length?W/2-bw/2:bx; bx=Math.max(4,Math.min(bx,W-bw-4));
  const bubble=`<rect x="${bx}" y="${by}" width="${bw}" height="28" rx="12" fill="#fff"/><path d="M${opt._tx!=null?Math.max(bx+14,Math.min(bx+bw-14,opt._tx)):bx+10} ${by+26} l-6 11 l12 -11z" fill="#fff"/><text x="${bx+10}" y="${by+19}" font-size="13" fill="#1b2331" stroke="#1b2331" stroke-width=".55" font-family="Cubic11,sans-serif">${esc(line)}</text>`;
  const vbTop=topY-18;
  return `<svg class="podium" ${opt.ai?`data-ai="${esc(opt.ai)}" data-aik="${esc(label+line)}"`:''} viewBox="0 ${vbTop} ${W} ${ground+14-vbTop}" role="img" aria-label="${esc(label)}"><ellipse cx="${W/2}" cy="${ground+2}" rx="${W/2-10}" ry="7" fill="#000" opacity=".25"/>${gs}${w}${bubble}</svg>`;

function coopState(){

  const T=guesses.filter(x=>x.round===rr&&x.kind==='team').sort((a,b)=>a.n-b.n);
  const B=guesses.filter(x=>x.round===rr&&x.kind==='boss').sort((a,b)=>a.n-b.n);

  const teamWin=T.some(x=>!x.hint&&x.A===s.len), bossWin=B.some(x=>x.A===s.len);

  if(c.surrender){over=true;result='lose';}
  else if(!waitingBoss&&(teamWin||bossWin)){over=true;result=teamWin&&bossWin?'tie':teamWin?'win':'lose';}
  const r=T.length+1, countdown=now<(c.startAt||0);
  const turnStart=r===1?(c.startAt||0):Math.max(c.startAt||0,(B[B.length-1]||{}).at||0);

}

function cpuThink(s,last){

    const left2=allCands(s.len,s.rep).filter(c=>fits(c,s.chist.concat([{g:gg,A:r.A,B:r.B}]))).length;
    s.chist.push({n:s.chist.length+1,g:gg,A:r.A,B:r.B,think:cpuThink(s,{g:gg,A:r.A,B:r.B},left2)});
    s.cpuBusy=false; soloDone();
    if(!s.result&&Math.random()<.35){pushPop(s.vil.n,pick(s.vil.all||[s.vil.says])); setTimeout(()=>playFx({target:'you',from:'boss',item:pick(['tomato','egg','slipper']),n:1},true),500);}
    render();
  },900+Math.random()*700);

function soloGuess(){
  const s=solo;
  if(s.phase==='setup'){s.mine=input;s.phase='play';s.start=Date.now();input='';err='';peek=false;render();window.scrollTo(0,0);return;}
  if(s.cpuBusy||s.result||(s.mode==='duel'&&s.chist.length<s.hist.length))return;
  const g2=input, r=score(s.secret,g2); s.hist.push({n:s.hist.length+1,g:g2,A:r.A,B:r.B});
  input=''; err='';
  if(s.mode==='duel'){ cpuTurn(); return; }
  soloDone();
  if(false) pushPop(s.vil.n,Math.random()<.5?pick(s.vil.all||[s.vil.says]):pick(TAUNT));
  render();
}
async function soloHint(){
  const s=solo; if(s.result||s.cpuBusy||s.phase!=='play')return;
  const got=new Set(s.hist.filter(x=>x.hint).map(x=>+x.pos)), free=[...Array(s.len).keys()].filter(i=>!got.has(i));
  if(free.length<=1){toast('提示最多用到只剩最後一位');return;}
  const pos=await pickPos(free,s.len,knownOf(s.hist,s.len),'這次提示算 1 次猜測'); if(pos==null||solo!==s||s.result||s.cpuBusy)return;
  const digit=s.secret[pos];
  s.hist.push({n:s.hist.length+1,hint:true,pos,g:digit});
  notes.pos[pos]=digit; notes.d[+digit]=1; saveNotes(); renderNotes();
  toast(`提示：第 ${pos+1} 位是 ${digit}`);
  if(s.mode==='duel') cpuTurn(); else render();
}
function soloGiveUp(){
  const s=solo; if(s.result)return;

  s.end=Date.now(); s.result='gave'; render();
}
/* 結算解析：用白話講給一般人看。魔王的「剩幾種」是它自己心裡的候選，和它實際選數字用的是同一套 */
let explainOpen=false, resTab='me';
function exPlain(x,len){const hit=x.A+x.B,ds=[...new Set(x.g)].join('、');
  if(x.A===len)return '全部都對，猜中了！';
  if(!hit)return `${ds} 全都不在答案裡。`;
  const head=hit===len?`這 ${len} 個數字全部都對`:`這 ${len} 個數字裡有 ${hit} 個是對的`;
  return head+(x.A&&x.B?`，其中 ${x.A} 個位置也對、${x.B} 個位置不對。`:x.A?`，而且位置${x.A>1?'都':'也'}對${hit<len?`，另外 ${len-hit} 個不在答案裡`:''}。`:`，但位置${x.B>1?'都':''}不對。`);}
/* 人類推理：互不重複的幾次猜測可以算出「各組數字有幾個」，例如 1234 有 2 個、5678 有 1 個 → 9、0 有 1 個 */
function exGroups(clues,len){const used=new Set(),G=[];clues.filter(x=>!x.hint).forEach(x=>{const ds=[...new Set(x.g)];if(ds.length!==x.g.length||ds.some(d=>used.has(d)))return;ds.forEach(d=>used.add(d));G.push({ds,n:x.A+x.B});});
  if(G.length<2)return [];const rest='1234567890'.split('').filter(d=>!used.has(d)),sum=G.reduce((t,g)=>t+g.n,0);if(rest.length)G.push({ds:rest,n:len-sum});return G;}
const exGroupTxt=G=>G.filter(g=>g.n>0).map(g=>`${g.ds.join('、')} 裡有 ${g.n} 個`).join('；');
function exKnown(c,len,clues,rep){if(!c.length)return '';const yes=[],no=[];for(let d=0;d<10;d++){const D=String(d),k=c.filter(x=>x.includes(D)).length;if(k===c.length)yes.push(D);else if(!k)no.push(D);}
  const pos=[];for(let i=0;i<len;i++){const D=c[0][i];pos.push(c.every(x=>x[i]===D)?D:'');}
  const t=[];const gt=rep||yes.length===len?'':exGroupTxt(exGroups(clues||[],len));if(gt)t.push(gt);if(yes.length)t.push(`一定有 ${yes.join('、')}`);if(no.length)t.push(`一定沒有 ${no.join('、')}`);
  if(!t.length&&!pos.some(Boolean))return '';
  return `<div class="exk">${pos.some(Boolean)?`<span class="htile">${pos.map(d=>`<i class="${d?'ha':''}">${d||'?'}</i>`).join('')}</span>`:''}${t.length?`<span>現在知道：${t.join('；')}</span>`:''}</div>`;}
const exHead=(i,g,sc,left)=>`<div class="exh"><span class="hn">第 ${i+1} 次</span><b>${esc(g)}</b>${sc}${left==null?'':`<span class="exn">剩 ${left} 種</span>`}</div>`;
const exSc=x=>`<span class="score"><span class="A">${x.A}A</span><span class="B">${x.B}B</span></span>`;
const ex0A=x=>x.A===0&&x.B>0?`因為是 0A，所以 ${[...x.g].map((d,i)=>`${d} 不在第 ${i+1} 位`).join('、')}。`:'';
/* 說明 g 為什麼不可能：從最近的線索往回找，優先用「數字個數」和「0A 位置」這種人想得到的理由 */
function exConflict(g,seen,len){for(let k=seen.length-1;k>=0;k--){const q=seen[k],no=q.i+1;
    if(q.hint){if(g[+q.pos]!==q.g)return `第 ${no} 次的提示說第 ${+q.pos+1} 位是 ${esc(q.g)}，但這次放的是 ${g[+q.pos]}`;continue;}
    const com=[...new Set(g)].filter(d=>q.g.includes(d)),hit=q.A+q.B;
    if(com.length>hit)return `第 ${no} 次說 ${q.g} 裡只有 ${hit} 個對，但這次用了 ${com.join('、')} 共 ${com.length} 個`;
    if(com.length<hit)return `第 ${no} 次說 ${q.g} 裡有 ${hit} 個對，但這次只用了 ${com.length} 個${com.length?`（${com.join('、')}）`:''}`;
    if(q.A===0){const p=[...g].findIndex((d,i)=>q.g[i]===d);if(p>=0)return `第 ${no} 次 ${q.g} 是 0A，所以 ${g[p]} 不能放第 ${p+1} 位`;}
    if(!fits(g,[q])){const r=score(g,q.g);return `位置對不上：第 ${no} 次猜 ${q.g} 實際是 ${q.A}A${q.B}B，假如答案是 ${g}，應該是 ${r.A}A${r.B}B`;}}
  return '';}
function cpuExplain(s){const all=allCands(s.len,s.rep),L=s.chist,len=s.len,n=s.vil.n,P=PROBES[len]||[],hard=s.diff==='hard';let left=all;const seen=[];
  const rows=L.map((x,i)=>{const before=left,after=before.filter(c=>mindFits(s,c,[x])),gone=before.filter(c=>!mindFits(s,c,[x])),win=x.A===len,probe=!hard&&P[i]===x.g;
    const G=s.rep?[]:exGroups(seen,len);
    const pickTxt=G.length?`所以這次${G.filter(g=>g.n>0).map(g=>`從 ${g.ds.join('、')} 挑 ${g.n} 個（${[...x.g].filter(d=>g.ds.includes(d)).join('、')}）`).join('，')}${seen.some(y=>y.A===0&&y.B>0)?'，並且避開 0A 排除的位置':''}。`:'從它心裡還可能的答案裡挑一個。';
    const why0=win?(before.length===1?'前面已經刪到只剩這一種，所以一定中。':`當時${hard?'':'它心裡'}還有 ${before.length} 種可能，它從裡面挑一個就中了，這次有運氣成分（機率 1/${before.length}）。`):probe?`開局固定先猜這組，不是要猜中，是要看 ${[...x.g].join('、')} 裡有幾個對。`:hard?'從還可能的答案裡，挑一個最能縮小範圍的。':pickTxt;
    const ex=gone.length?gone[Math.floor(gone.length/2)]:'', r=ex?score(ex,x.g):null;
    const eg=hard&&ex&&!win?`<p class="exw">隨便舉一個被刪掉的例子：假如答案是 ${ex}，猜 ${x.g} 會得到 ${r.A}A${r.B}B，但實際是 ${x.A}A${x.B}B，所以 ${ex} 不可能。全部 ${before.length} 種都這樣比過。</p>`:'';
    left=after;seen.push(Object.assign({i},x));
    const only=!win&&after.length&&after.length<=6?`<p class="exw">${after.length===1?`算到這裡只剩 ${after[0]}。`:`只剩 ${after.join('、')} 還可能。`}</p>`:'';
    return `<li>${exHead(i,x.g,exSc(x),win?null:after.length)}<p class="exw">${why0}</p><p class="exp">結果：${exPlain(x,len)}${win?'':ex0A(x)}</p>${eg}${only}${win||!after.length?'':exKnown(after,len,seen,s.rep)}</li>`;}).join('');
  const intro=hard?`${esc(n)}用電腦硬算：列出全部 ${all.length} 種可能，每猜一次，就把幾A幾B 對不上的刪掉。它沒有看你的題目。`:`${esc(n)}像人一樣想：先算每組數字有幾個對，再用 0A 排除位置，線索都記得，也沒有看你的題目。「剩幾種」是它心裡覺得還可能的數量。`;
  return `<div class="expl"><p class="exi">${intro}</p><ol>${rows}</ol></div>`;}
function myExplain(s){const all=allCands(s.len,s.rep),len=s.len;let left=all,bad=0;const seen=[];
  const rows=s.hist.map((x,i)=>{
    if(x.hint){left=left.filter(c=>c[+x.pos]===x.g);seen.push(Object.assign({i},x));return `<li>${exHead(i,'提示','',left.length)}<p class="exp">用提示知道第 ${+x.pos+1} 位是 ${esc(x.g)}。</p>${exKnown(left,len,seen,s.rep)}</li>`;}
    const before=left,legal=before.includes(x.g),after=before.filter(c=>fits(c,[x])),win=x.A===len;left=after;let note='';
    if(win)note=before.length===1?'前面已經推到只剩這一種，漂亮！':`當時還有 ${before.length} 種可能，這次猜中有運氣成分（機率 1/${before.length}）。`;
    else if(!legal){bad++;const why=exConflict(x.g,seen,len);note=`${x.g} 不可能是答案：${why}。`+(after.length<before.length?'不過它還是幫你排除了一些可能，可以當作篩數字用。':'而且它也沒有幫你排除新的可能。');}
    seen.push(Object.assign({i},x));
    return `<li>${exHead(i,x.g,exSc(x),win?null:after.length)}<p class="exp">${exPlain(x,len)}${win?'':ex0A(x)}</p>${note?`<p class="exw">${note}</p>`:''}${!win&&after.length&&after.length<=6?`<p class="exw">只剩 ${after.join('、')} 還可能。</p>`:''}${win||!after.length?'':exKnown(after,len,seen,s.rep)}</li>`;}).join('');
  return `<div class="expl"><p class="exi">電腦幫你算的：每猜一次，還可能是答案的數字剩幾種。猜「還可能是答案」的數字才有機會直接中；不可能的數字雖然中不了，但有時可以用來篩數字。${bad?`這局有 ${bad} 次猜的數字已經不可能是答案。`:'這局你每次猜的都還可能是答案。'}</p><ol>${rows}</ol></div>`;}
function cpuHistHTML(L){
  if(!L.length)return'<div class="empty-h">魔王還沒猜</div>';
